[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-asset-intake"
version = "0.1.0"
description = "Bounded local raster-image intake for Agent OS"
requires-python = ">=3.10"
dependencies = ["Pillow>=11.3,<13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["visual_asset_intake", "visual_asset_intake.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-asset-routing"
version = "0.1.0"
description = "Bounded provider-neutral visual asset routing for Agent OS"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["visual_asset_routing", "visual_asset_routing.*"]

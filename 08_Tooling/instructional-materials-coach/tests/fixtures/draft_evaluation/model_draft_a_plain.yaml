title: Day 1 Worksheet – Color Planning for Candy Branding
objectives: []
lesson_identity:
  day_lesson_number: Day 1
slides:
  - index: 1
    heading: Choose Colors on Purpose
    bullets:
      - "Colors send a message about your candy."
      - "Think about the mood first: fun, sweet, sour, or fancy?"
      - "Think about your audience: who will buy this candy?"
      - "Plan on paper before you open any software."
  - index: 2
    heading: Plan and Explain
    bullets:
      - "Pick 2 to 4 colors for your candy brand."
      - "Match each color to your mood or audience."
      - "Use a short sentence: I chose ___ because ___."
worksheet_questions:
  - "What is the mood of your candy brand? Write 1 or 2 words (for example: fun, sour, fancy)."
  - "Who is your audience? Write who will buy or eat your candy."
  - "List 2 to 4 colors you will use. Next to each color, write one reason it fits your mood or audience."
  - "Finish this sentence: My colors match my candy because ___."
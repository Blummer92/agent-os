title: "Day 1 Worksheet: Color Planning for Candy Branding"
objectives: []
lesson_identity:
  day_lesson_number: Day 1
slides:
  - index: 1
    heading: "Color Tells a Story"
    bullets:
      - "Hook: The Institute for Color Research reports that people judge a product in about 90 seconds, and 62% to 90% of that snap judgment is based on color alone."
      - "Think: What color makes you grab a candy bar off the shelf?"
      - "Today's target: I can choose colors on purpose and explain how they match the candy mood and audience."
  - index: 2
    heading: "Plan First, Software Later"
    bullets:
      - "Step 1: Pick a mood (sweet, sour, fruity, chocolatey, funny, fancy)."
      - "Step 2: Name your audience (who will buy it?)."
      - "Step 3: Pick colors that fit both."
      - "Today we plan on paper. No software yet."
worksheet_questions:
  - "Question 1: What is your candy's mood? Pick one word (like sweet, sour, or fancy) and write it down."
  - "Question 2: Who is your candy for? Write 3 to 5 words about your audience (like 'kids ages 8 to 12')."
  - "Question 3: Choose 3 colors for your candy brand. Next to each color, write one word for the feeling it gives."
  - "Question 4: Finish this sentence: 'I chose these colors because they match the ___ mood and the ___ audience.'"
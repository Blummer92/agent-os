title: Day 1 Worksheet – Color Planning for Candy Branding
objectives: []
lesson_identity:
  day_lesson_number: Day 1
slides:
  - index: 1
    heading: Choose Colors on Purpose
    bullets:
      - "Goal: I can choose colors on purpose and explain how they match the candy mood and audience."
      - "Today we plan colors on paper before we open any software."
      - "Every color should have a reason."
  - index: 2
    heading: Plan Your Candy Colors
    bullets:
      - "Step 1: Name your candy and its mood."
      - "Step 2: Name your audience."
      - "Step 3: Pick 2–3 colors and give a reason for each."
      - "Use short, clear sentences."
worksheet_questions:
  - "Mood. (a) Write your candy's name or idea. (b) Pick 3 mood words, such as sweet, sour, fun, or fancy. (c) In one sentence, say how your candy should feel."
  - "Audience. (a) Who will buy or eat this candy? (b) Write one thing they like. (c) In one sentence, say what kind of colors they might enjoy and why."
  - "Color choices. (a) List 2–3 colors for your brand. (b) Next to each, write one reason it fits your mood. (c) Say which color is your main color."
  - "Explain it. (a) Finish this sentence: 'I chose ___ because it matches ___.' (b) Add one sentence about how your colors will appeal to your audience. (c) Name one color you decided not to use and why."
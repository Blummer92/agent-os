lesson_id: marketing-foundations-day1
lesson_title: Marketing Foundations — Day 1 (metadata record)

objectives:
  - Compare disposable and reusable water bottles using evidence.
  - Distinguish Place convenience (where a product is found) from Product convenience (what it is).
  - Analyze in-store positioning: store aisle versus checkout.
  - Evaluate Price willingness-to-pay and the convenience premium.
  - Make an evidence-supported price/tradeoff recommendation.


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-asset-ingestion-coordinator"
version = "0.1.0"
description = "Repair-safe visual asset ingestion coordinator for Agent OS"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["visual_asset_ingestion_coordinator", "visual_asset_ingestion_coordinator.*"]

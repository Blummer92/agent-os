[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-compute-decision-writer"
version = "0.1.0"
description = "Bounded offline-first Notion Compute Decision writer for Agent OS (#1424)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["notion_compute_decision_writer", "notion_compute_decision_writer.*"]

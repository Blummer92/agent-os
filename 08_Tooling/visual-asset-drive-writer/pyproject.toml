[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-asset-drive-writer"
version = "0.1.0"
description = "Bounded offline-first Google Drive asset write contract for Agent OS"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["visual_asset_drive_writer", "visual_asset_drive_writer.*"]

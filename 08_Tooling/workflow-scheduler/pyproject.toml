[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-scheduler"
version = "0.10.0"
description = "Agent OS Workflow Scheduler: dependency-ordered task execution, governance stop-condition checks, lease locks, and audit logging."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

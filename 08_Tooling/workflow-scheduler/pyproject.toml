[build-system]
requires = ["setuptools>=74.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-scheduler"
version = "0.16.0"
description = "Agent OS Workflow Scheduler: dependency-ordered task execution, governance stop-condition checks, lease locks, and audit logging."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
ext-modules = [
  {name = "workflow_scheduler.execution._clone3_cgroup", sources = ["src/workflow_scheduler/execution/_clone3_cgroup.c"]}
]

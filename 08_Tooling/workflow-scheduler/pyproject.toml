[build-system]
requires = ["setuptools>=74.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-scheduler"
version = "0.18.0"
description = "Agent OS Workflow Scheduler: dependency-ordered task execution, governance stop-condition checks, lease locks, and audit logging. Also distributes the canonical repository-root execution contract packages this runtime imports (#1300)."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "PyGithub>=2.9.1,<3",
  "requests>=2.31,<3",
  # PYLIB5 pilot (#3222): Typer + Rich for the thin human-readable
  # scheduler-status wrapper only. No existing CLI uses them; the machine
  # JSON path stays on plain json.dumps.
  "typer>=0.27,<1",
  "rich>=15.0,<16",
]

[project.scripts]
agent-os-scheduler-status = "workflow_scheduler.status_cli:main"

# #1300 (AOS-GCE2C): the Scheduler runtime already imports canonical
# repository-root ``scripts.*`` contract packages (for example
# ``workflow_scheduler.execution.continuation`` imports
# ``scripts.agent_os_execution_checkpoint.resume_planner``). Those packages stay
# canonical where they are -- they are declared here, not copied, so a clean host
# installation resolves them without repository-root ``PYTHONPATH``. #1426 adds
# the execution-interface contract package required by the installed #1411
# publication path under the same single-owner distribution boundary.
# #3158 adds the issue-labels contract package: the installed
# ``agent-os-mcp`` server imports
# ``scripts.agent_os_issue_labels.connected_issue_creation`` through
# ``agent_os_execution_service.connected_issue_creation_facade``, and no host
# distribution shipped it.
# ``packages`` must be explicit because ``packages.find`` only discovers packages
# under a single ``where`` root and ignores out-of-tree ``package-dir`` entries.
[tool.setuptools]
packages = [
  "workflow_scheduler",
  "workflow_scheduler.adapters",
  "workflow_scheduler.audit",
  "workflow_scheduler.dependencies",
  "workflow_scheduler.execution",
  "workflow_scheduler.governance",
  "workflow_scheduler.models",
  "workflow_scheduler.planning",
  "workflow_scheduler.queue",
  "workflow_scheduler.repository",
  "scripts.agent_os_execution_capabilities",
  "scripts.agent_os_execution_checkpoint",
  "scripts.agent_os_execution_interface",
  "scripts.agent_os_issue_acceptance",
  "scripts.agent_os_github_git_objects",
  "scripts.agent_os_github_issue_provider",
  "scripts.agent_os_github_target_guard",
  "scripts.agent_os_issue_acceptance.checks",
  "scripts.agent_os_issue_acceptance.typed_subject_approval",
  "scripts.agent_os_issue_labels",
  "scripts.agent_os_remote_validation",
]

[tool.setuptools.package-dir]
"" = "src"
"scripts.agent_os_execution_capabilities" = "../../scripts/agent_os_execution_capabilities"
"scripts.agent_os_execution_checkpoint" = "../../scripts/agent_os_execution_checkpoint"
"scripts.agent_os_execution_interface" = "../../scripts/agent_os_execution_interface"
"scripts.agent_os_issue_acceptance" = "../../scripts/agent_os_issue_acceptance"
"scripts.agent_os_github_git_objects" = "../../scripts/agent_os_github_git_objects"
"scripts.agent_os_github_issue_provider" = "../../scripts/agent_os_github_issue_provider"
"scripts.agent_os_github_target_guard" = "../../scripts/agent_os_github_target_guard"
"scripts.agent_os_issue_acceptance.typed_subject_approval" = "../../scripts/agent_os_issue_acceptance/typed_subject_approval"
"scripts.agent_os_issue_labels" = "../../scripts/agent_os_issue_labels"
"scripts.agent_os_remote_validation" = "../../scripts/agent_os_remote_validation"
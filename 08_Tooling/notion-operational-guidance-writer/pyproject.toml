[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-operational-guidance-writer"
version = "0.1.0"
description = "Bounded offline-first Notion operational guidance writer for Agent OS (#1467)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["notion_operational_guidance_writer", "notion_operational_guidance_writer.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os-execution-service"
version = "0.5.0"
description = "Agent OS execution-service package: immutable read-only request and inspection core, deterministic validation planning and non-executing executor routing, plus a governed non-authorizing validation-execution composition boundary over the canonical Workflow Scheduler runtime"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

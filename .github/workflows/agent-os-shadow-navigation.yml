name: Agent OS Shadow Navigation

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Shadow experiment campaign identifier
        required: true
        default: github-actions-shadow
        type: string
      candidates:
        description: Optional comma-separated deterministic narrowing set
        required: false
        type: string
      narrowing_criterion:
        description: Required when candidates is supplied
        required: false
        type: string
      explicit_order:
        description: Optional comma-separated explicit request order
        required: false
        type: string
      mission_id:
        description: Optional finite-mission evidence-ledger identifier
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-os-shadow-navigation-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  shadow-navigation:
    name: Run read-only shadow navigation
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node for jscpd
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate same-revision scanner advisories
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          scanner_root="$RUNNER_TEMP/agent-os-shadow-scanners"
          mkdir -p "$scanner_root/jscpd" "$scanner_root/pyan3"
          # Producers write scanner-error JSON when possible; if a process
          # cannot start, pass the missing path and record unavailable.
          if ! python -m scripts.jscpd_advisory --output "$scanner_root/jscpd" --sha "$source_sha"; then
            echo "::warning::jscpd producer unavailable; advisory remains non-blocking"
          fi
          if python -m pip install "pyan3==2.9.0"; then
            if ! python -m scripts.pyan3_advisory --output "$scanner_root/pyan3" --sha "$source_sha"; then
              echo "::warning::pyan3 producer unavailable; advisory remains non-blocking"
            fi
          else
            echo "::warning::Pinned pyan3 unavailable; shadow will record unavailable"
          fi

      - name: Run Agent OS shadow navigation
        id: shadow
        uses: ./.github/actions/agent-os-shadow-navigation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          campaign_id: ${{ inputs.campaign_id }}
          candidates: ${{ inputs.candidates }}
          narrowing_criterion: ${{ inputs.narrowing_criterion }}
          explicit_order: ${{ inputs.explicit_order }}
          mission_id: ${{ inputs.mission_id }}
          scanner_evidence_jscpd: ${{ runner.temp }}/agent-os-shadow-scanners/jscpd/jscpd-advisory.json
          scanner_evidence_pyan3: ${{ runner.temp }}/agent-os-shadow-scanners/pyan3/pyan3-advisory.json

      - name: Verify zero-mutation boundary
        env:
          SHADOW_REPORT: ${{ steps.shadow.outputs.report_path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["SHADOW_REPORT"]).read_text(encoding="utf-8"))
          zero = report["zero_mutation_verification"]
          deterministic = report["deterministic_selector_result"]

          assert zero["http_write_requests"] == 0
          assert zero["github_mutations"] == 0
          assert zero["execution_authorized"] is False
          assert zero["side_effects_performed"] is False
          assert deterministic["execution_authorized"] is False
          assert deterministic["side_effects_performed"] is False
          PY

      - name: Publish shadow-navigation summary
        env:
          SHADOW_REPORT: ${{ steps.shadow.outputs.report_path }}
          SHADOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["SHADOW_REPORT"]).read_text(encoding="utf-8"))
          receipt = report["population_receipt"]
          candidates = report["candidate_population"]
          selection = report["deterministic_selector_result"]
          zero = report["zero_mutation_verification"]

          lines = [
              "## Agent OS Shadow Navigation",
              "",
              f"- Repository: `{report['repository']}`",
              f"- Campaign: `{report['campaign_id']}`",
              f"- Population complete: `{receipt['scan_complete']}`",
              f"- Open issues scanned: `{receipt['scan_item_count']}`",
              f"- Scan pages: `{receipt['scan_page_count']}`",
              f"- Candidates considered: `{len(candidates['candidate_issue_numbers'])}`",
              f"- Deterministic status: `{selection['status']}`",
              f"- Selected issue: `{selection['selected_issue_number']}`",
              f"- Reason codes: `{','.join(selection['reason_codes'])}`",
              f"- Manual-review cases: `{len(report['manual_review_cases'])}`",
              f"- HTTP writes: `{zero['http_write_requests']}`",
              f"- GitHub mutations: `{zero['github_mutations']}`",
              "",
              "Read-only boundary: this workflow observes and reports only. It does not authorize or initiate governed execution.",
          ]

          advisory = report.get("scanner_advisory")
          if advisory is not None:
              def cell(value):
                  return str(value if value is not None else "n/a").replace("|", r"\|").replace("\n", " ")

              lines.extend([
                  "",
                  "### Scanner advisory (§14 — evidence only)",
                  "",
                  "| Tool | Producer status | Evidence state | SHA | Candidates | Loaded | Truncated | Out-of-scope |",
                  "| --- | --- | --- | --- | ---: | ---: | --- | ---: |",
              ])
              for source in advisory["sources"]:
                  lines.append("| " + " | ".join(cell(v) for v in (
                      source.get("tool") or source.get("source"),
                      source["status"],
                      source["state"],
                      source.get("head_sha"),
                      source.get("candidate_count"),
                      len(source["findings"]),
                      source.get("truncated"),
                      source.get("out_of_scope_findings"),
                  )) + " |")
                  lines.append(
                      f"- {cell(source.get('tool') or source.get('source'))}: "
                      f"version {cell(source.get('version'))}; "
                      f"scanned scope {cell(', '.join(source.get('scope') or []))}. "
                      "Other paths are not established as scanned."
                  )
                  if source.get("failure_detail"):
                      lines.append(f"  - Error: {cell(source['failure_detail'])}")
              lines.extend([
                  "",
                  "**Advisory only:** findings are not selection inputs, "
                  "do not authorize execution, and cannot justify deletion.",
                  "jscpd reports textual similarity, not semantic equivalence. "
                  "pyan3 reports missing resolved static callers, not runtime unreachability. "
                  "Check dynamic entrypoints, tests, and registrations.",
                  "Truncated results are incomplete; unscanned packages (including Notion) "
                  "must not be interpreted as having zero findings.",
                  f"Full §14 findings and provenance: [run artifacts]"
                  f"({os.environ['SHADOW_RUN_URL']}#artifacts) (7-day retention).",
              ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload shadow-navigation evidence
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-shadow-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.shadow.outputs.report_path }}
          if-no-files-found: error
          retention-days: 7

# Staged migration: pilot context is NOT yet a required ruleset check.
# Only trusted default-branch code executes with statuses:write.
name: Agent OS Trusted Status Pilot

on:
  workflow_run:
    workflows: ["Agent OS Validation Gate"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  publish:
    name: Verify source and publish pilot status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch authority
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify source jobs using provider records only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent_os_trusted_status_publisher.py --publish

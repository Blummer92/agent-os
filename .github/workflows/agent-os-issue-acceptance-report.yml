name: Agent OS Issue Acceptance Report

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to report on"
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-acceptance-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  relevance:
    name: Classify acceptance inputs
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.relevance.outputs.should_run }}
      reason: ${{ steps.relevance.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Classify pull request event
        id: relevance
        run: python -m scripts.agent_os_issue_acceptance.edit_relevance "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  report:
    name: Run issue acceptance report
    needs: relevance
    if: needs.relevance.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python test environment
        uses: ./.github/actions/setup-python-dev

      - name: Build local acceptance fixtures from PR data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          out="tmp/agent_os_issue_acceptance_report"
          mkdir -p "$out"
          : > "$out/issue.md"
          : > "$out/pr_body.md"
          : > "$out/pr_title.txt"
          : > "$out/changed_files.txt"
          : > "$out/diff.patch"
          printf '%s\n' false > "$out/issue_body_retrieval_failed.txt"
          printf '%s\n' false > "$out/changed_files_incomplete.txt"
          printf '%s\n' false > "$out/diff_retrieval_failed.txt"

          if [ -z "${PR_NUMBER:-}" ]; then
            cat > "$out/pr_body.md" <<'MD'
          Manual workflow dispatch did not provide a pull request number.

          This report-only workflow should route missing pull request context to manual review or fail according to IA2 semantics.
          MD
            exit 0
          fi

          gh pr view "$PR_NUMBER" --json title --jq '.title // ""' > "$out/pr_title.txt"
          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' > "$out/pr_body.md"
          authoritative_changed_files="$(gh pr view "$PR_NUMBER" --json changedFiles --jq '.changedFiles')"
          gh pr view "$PR_NUMBER" --json files --jq '.files[].path' > "$out/changed_files.txt"
          retrieved_changed_files="$(wc -l < "$out/changed_files.txt" | tr -d '[:space:]')"
          if [ "$retrieved_changed_files" != "$authoritative_changed_files" ]; then
            printf '%s\n' true > "$out/changed_files_incomplete.txt"
          fi
          if ! gh pr diff "$PR_NUMBER" --patch > "$out/diff.patch"; then
            : > "$out/diff.patch"
            printf '%s\n' true > "$out/diff_retrieval_failed.txt"
          fi

          linked_issue="$(
            python - <<'PY'
          from pathlib import Path

          from scripts.agent_os_issue_acceptance.models import LinkedIssueParseStatus
          from scripts.agent_os_issue_acceptance.parse_pr import parse_linked_issue_result

          out = Path("tmp/agent_os_issue_acceptance_report")
          result = parse_linked_issue_result(
              (out / "pr_body.md").read_text(encoding="utf-8"),
              (out / "pr_title.txt").read_text(encoding="utf-8"),
          )
          from scripts.agent_os_issue_acceptance.parse_pr import report_only_issue_number
          number = report_only_issue_number(result)
          print(number or "")
          PY
          )"
          printf '%s\n' "$linked_issue" > "$out/linked_issue.txt"

          if [ -n "$linked_issue" ]; then
            if ! gh issue view "$linked_issue" --json body --jq '.body // ""' > "$out/issue.md"; then
              : > "$out/issue.md"
              printf '%s\n' true > "$out/issue_body_retrieval_failed.txt"
            fi
          fi

      - name: Run report-only issue acceptance checker
        id: acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set +e
          captured_issue_body_file="tmp/agent_os_issue_acceptance_report/issue.md"
          captured_pr_head_sha=""
          if [ -n "${GITHUB_PR_NUMBER:-}" ]; then
            captured_pr_head_sha="$(gh pr view "$GITHUB_PR_NUMBER" --json headRefOid --jq '.headRefOid // ""')"
          fi
          evaluator_sha="$(git rev-parse HEAD)"
          observed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          issue_body_retrieval_failed="$(cat tmp/agent_os_issue_acceptance_report/issue_body_retrieval_failed.txt)"
          changed_files_incomplete="$(cat tmp/agent_os_issue_acceptance_report/changed_files_incomplete.txt)"
          diff_retrieval_failed="$(cat tmp/agent_os_issue_acceptance_report/diff_retrieval_failed.txt)"
          fresh_issue_body_file=""
          fresh_issue_body_available=false
          fresh_pr_head_sha=""
          fresh_pr_head_sha_available=false
          linked_issue="$(cat tmp/agent_os_issue_acceptance_report/linked_issue.txt 2>/dev/null || true)"
          if [ -n "$linked_issue" ]; then
            if gh issue view "$linked_issue" --json body --jq '.body // ""' > tmp/agent_os_issue_acceptance_report/issue_recheck.md; then
              fresh_issue_body_available=true
              fresh_issue_body_file="tmp/agent_os_issue_acceptance_report/issue_recheck.md"
            else
              issue_body_retrieval_failed=true
              : > tmp/agent_os_issue_acceptance_report/issue_recheck.md
            fi
          fi
          if [ -n "${GITHUB_PR_NUMBER:-}" ]; then
            if fresh_pr_head_sha="$(gh pr view "$GITHUB_PR_NUMBER" --json headRefOid --jq '.headRefOid // ""')"; then
              if [ -n "$fresh_pr_head_sha" ]; then
                fresh_pr_head_sha_available=true
              fi
            else
              fresh_pr_head_sha=""
            fi
          fi

          # Cumulative merged-docs evidence (#3719, read-only): discover
          # merged PRs for the same issue from the issue timeline, verify
          # merged state and merge-commit ancestry of the evaluated base,
          # and write a JSON record list (or [] on any failure). The
          # checker re-validates every record; this step never passes a
          # check on its own.
          captured_pr_base_sha=""
          if [ -n "${GITHUB_PR_NUMBER:-}" ]; then
            captured_pr_base_sha="$(gh pr view "$GITHUB_PR_NUMBER" --json baseRefOid --jq '.baseRefOid // ""')"
          fi
          if [ -n "$linked_issue" ] && [ -n "$captured_pr_base_sha" ]; then
            python -m scripts.agent_os_issue_acceptance.build_merged_doc_evidence \
              --repository "$GITHUB_REPOSITORY" \
              --issue-number "$linked_issue" \
              --current-pr-number "$GITHUB_PR_NUMBER" \
              --base-sha "$captured_pr_base_sha" \
              --issue-body-file tmp/agent_os_issue_acceptance_report/issue.md \
              --output tmp/agent_os_issue_acceptance_report/merged_docs.json
          else
            printf '%s\n' '[]' > tmp/agent_os_issue_acceptance_report/merged_docs.json
          fi

          transport_args=(
            --transport-repository "$GITHUB_REPOSITORY"
            --transport-issue-body-file "$captured_issue_body_file"
            --transport-pr-head-sha "$captured_pr_head_sha"
            --transport-evaluator-sha "$evaluator_sha"
            --transport-workflow-run-id "$GITHUB_RUN_ID"
            --transport-workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
            --transport-observed-at "$observed_at"
          )
          evidence_args=()
          if [ "$changed_files_incomplete" = true ]; then
            evidence_args+=(--changed-files-incomplete)
          fi
          if [ "$diff_retrieval_failed" = true ]; then
            evidence_args+=(--diff-retrieval-failed)
          fi
          if [ -n "$linked_issue" ]; then
            transport_args+=(--transport-issue-number "$linked_issue")
          fi
          if [ "$issue_body_retrieval_failed" = true ]; then
            transport_args+=(--transport-issue-body-retrieval-failed)
          fi
          if [ "$fresh_issue_body_available" = true ]; then
            transport_args+=(--transport-fresh-issue-body-file "$fresh_issue_body_file")
          fi
          if [ "$fresh_pr_head_sha_available" = true ]; then
            transport_args+=(--transport-fresh-pr-head-sha "$fresh_pr_head_sha")
          fi
          if [ -n "${GITHUB_PR_NUMBER:-}" ]; then
            transport_args+=(--transport-pr-number "$GITHUB_PR_NUMBER")
          fi

          python -m scripts.agent_os_issue_acceptance.cli \
            --issue tmp/agent_os_issue_acceptance_report/issue.md \
            --pr-body tmp/agent_os_issue_acceptance_report/pr_body.md \
            --changed-files tmp/agent_os_issue_acceptance_report/changed_files.txt \
            --diff tmp/agent_os_issue_acceptance_report/diff.patch \
            --pr-title "$(cat tmp/agent_os_issue_acceptance_report/pr_title.txt)" \
            --documentation-advisory \
            --merged-docs-evidence tmp/agent_os_issue_acceptance_report/merged_docs.json \
            "${evidence_args[@]}" \
            "${transport_args[@]}" \
            | tee tmp/agent_os_issue_acceptance_report/report.txt
          checker_exit_code=${PIPESTATUS[0]}
          echo "checker_exit_code=${checker_exit_code}" >> "$GITHUB_OUTPUT"
          # E3 (#3506): the check must represent the child result. A `fail`
          # report (checker exit 1) fails this non-required check instead of
          # masquerading as green. Manual-review (exit 0 by checker design)
          # remains green, exactly as the checker contract defines it.
          exit "$checker_exit_code"

      - name: Publish report summary
        # NB-2 (#3506): render the summary even when the checker step
        # failed (E3 makes that failure visible as a red non-required
        # check). This does not mask the failure: the checker step's
        # non-zero exit still determines the job/check result.
        if: always()
        run: |
          {
            echo "## Agent OS Issue Acceptance Report"
            echo
            # The report file can be absent when an earlier step failed
            # before the checker ran; degrade to an explicit notice
            # instead of failing this step and truncating the summary.
            # A partial report is rendered as-is.
            if [ -f tmp/agent_os_issue_acceptance_report/report.txt ]; then
              cat tmp/agent_os_issue_acceptance_report/report.txt
            else
              echo "Report output unavailable: the checker did not produce a report file."
            fi
            echo
            echo "Checker exit code: ${{ steps.acceptance.outputs.checker_exit_code }}"
            echo
            echo "Report-only boundary: this workflow does not approve, merge, label, close, or mutate issues or pull requests."
          } >> "$GITHUB_STEP_SUMMARY"

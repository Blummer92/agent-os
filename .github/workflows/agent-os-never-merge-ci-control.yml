# Disposable control. NEVER MERGE. No authoritative verdict or publication.
name: Never merge CI control 10
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/agent-os-never-merge-ci-control.yml]
permissions:
  contents: read
jobs:
  control:
    name: Observe refuse contract C10
    if: >-
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'test/never-merge-ci-c10-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONPATH: src:08_Tooling/workflow-scheduler/src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Verify exact head before installing or running tests
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install standard validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r 08_Tooling/workflow-scheduler/requirements.txt
          python -m pip install -e "./08_Tooling/instructional-materials-coach[test]"
          python -m pip install -e "./08_Tooling/notion-navigation-client[test]"
      - name: Verify C10 expected refuse inside the control
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -o addopts='' -q tests/agent_os_remote_validation/test_main_health_admission.py::test_unhealthy_main_blocks_before_aggregate_is_requested tests/agent_os_remote_validation/test_main_health_admission.py::test_infrastructure_unproven_main_fails_closed_without_false_red_attribution
          printf 'C10: expected refuse contract observed (non-authoritative)\n' >> "$GITHUB_STEP_SUMMARY"

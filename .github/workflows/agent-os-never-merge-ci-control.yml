# Disposable control. NEVER MERGE. No authoritative verdict or publication.
name: Never merge CI control 03
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/agent-os-never-merge-ci-control.yml]
permissions:
  contents: read
jobs:
  control:
    name: Observe pass contract C03
    if: >-
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'test/never-merge-ci-c03-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONPATH: src:08_Tooling/workflow-scheduler/src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Verify exact head before installing or running tests
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install standard validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r 08_Tooling/workflow-scheduler/requirements.txt
          python -m pip install -e "./08_Tooling/instructional-materials-coach[test]"
          python -m pip install -e "./08_Tooling/notion-navigation-client[test]"
      - name: Verify C03 expected pass inside the control
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -o addopts='' -q tests/test_2181_readiness_projection_not_candidate_universe.py tests/test_bounded_bug_title_enumeration_contract.py tests/test_bug_backlog_first_selection_policy.py tests/test_bug_discovery_persistence_continuation_contract.py tests/test_issue_2392_title_bug_five_count_contract.py
          printf 'C03: expected pass contract observed (non-authoritative)\n' >> "$GITHUB_STEP_SUMMARY"

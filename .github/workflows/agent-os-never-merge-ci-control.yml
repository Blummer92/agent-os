# Disposable control. NEVER MERGE. No authoritative verdict or publication.
name: Never merge CI control 01
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/agent-os-never-merge-ci-control.yml]
permissions:
  contents: read
jobs:
  control:
    name: Observe pass contract C01
    if: >-
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'test/never-merge-ci-c01-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONPATH: src:08_Tooling/workflow-scheduler/src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Verify exact head before installing or running tests
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install standard validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r 08_Tooling/workflow-scheduler/requirements.txt
          python -m pip install -e "./08_Tooling/instructional-materials-coach[test]"
          python -m pip install -e "./08_Tooling/notion-navigation-client[test]"
      - name: Verify C01 expected pass inside the control
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -o addopts='' -q tests/ci_perf/test_root_shadow.py::test_shadow_parity_passes tests/test_agent_os_ci_branch_coverage.py::test_at_exact_floor_records_every_report_and_identity
          bash scripts/ci-local.sh
          printf 'C01: expected pass contract observed (non-authoritative)\n' >> "$GITHUB_STEP_SUMMARY"

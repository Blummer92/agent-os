name: Agent OS 3251 focused behavioral regression

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/agent-os-3251-behavioral.yml"
      - "src/instructional_workflow_contracts/**"
      - "08_Tooling/instructional-materials-coach/**"
      - "tests/test_3252_teacher_decision_record.py"

permissions:
  contents: read

concurrency:
  group: agent-os-3251-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-head-focused-tests:
    name: Exact-head decision and placement pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'Expected: %s\nActual: %s\n' "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            08_Tooling/instructional-materials-coach/pyproject.toml

      - name: Install repository test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -e "./08_Tooling/instructional-materials-coach[test]"

      - name: Execute exact-head focused pytest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p junit-3251
          python -m pytest -q \
            tests/test_3252_teacher_decision_record.py \
            08_Tooling/instructional-materials-coach/tests/test_visual_role_slots_3251.py \
            08_Tooling/instructional-materials-coach/tests/test_generation_context.py \
            08_Tooling/instructional-materials-coach/tests/test_3257_connected_visual_placement.py \
            08_Tooling/instructional-materials-coach/tests/test_cli.py \
            --junitxml=junit-3251/exact-head.xml

      - name: Upload JUnit for independent verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-3251-focused-${{ github.run_attempt }}
          path: junit-3251/
          if-no-files-found: warn
          retention-days: 7

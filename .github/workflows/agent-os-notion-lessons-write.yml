name: Agent OS Bounded Lessons Learned Write

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# Serialize this one destination across all admitted comments. Do not cancel a
# secret-bearing write. Reruns are refused by admission before credential use.
concurrency:
  group: agent-os-lessons-write-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  lessons_write:
    # #3417: any ordinary (non-PR) issue is a durable request surface. The
    # reviewed catalog entry authorizes content; the owner comment the write.
    if: ${{ github.event.issue.pull_request == null && github.event.comment.user.id == 32861845 && startsWith(github.event.comment.body, '/agent-os notion-write ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src:08_Tooling/workflow-scheduler/src:.
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Admit exact owner request without credentials
        run: |
          python -m scripts.agent_os_notion_lessons_write.runner \
            --phase admit --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/agent-os-lessons-write/admission.json"

      - name: Execute one bounded write and two canonical readbacks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AGENT_OS_LESSONS_LEARNED_DATA_SOURCE_ID: ${{ vars.AGENT_OS_LESSONS_LEARNED_DATA_SOURCE_ID }}
        run: |
          # If the job dies before writing its result, the summary must never
          # reuse admission.json and falsely claim zero write attempts.
          touch "$RUNNER_TEMP/agent-os-lessons-write/execution-started"
          python -m scripts.agent_os_notion_lessons_write.runner \
            --phase execute --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/agent-os-lessons-write/result.json"

      - name: Publish sanitized result summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'agent-os-lessons-write'
          target = root / 'result.json'
          if not target.exists():
              target = root / 'admission.json'
          try:
              result = json.loads(target.read_text()) if target.exists() else {}
          except (OSError, ValueError):
              result = {}
          if (root / 'execution-started').exists() and (
              target.name != 'result.json' or not isinstance(result, dict)
              or result.get('status') == 'admitted' or not result
          ):
              result = {'status': 'uncertain', 'reason_code': 'execution-incomplete',
                        'write_attempts': 1, 'readback_verified': False}
          verification_path = root / 'verification.json'
          try:
              verification = json.loads(verification_path.read_text()) if verification_path.exists() else {}
          except (OSError, ValueError):
              verification = {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Agent OS Lessons Learned: ' + result.get('status', 'unavailable') + '\n\n')
              for key in ('reason_code', 'recovery_reason', 'write_attempts',
                          'readback_verified', 'page_id', 'lesson_id', 'revision',
                          'create_receipt_recovered', 'update_receipt_recovered'):
                  summary.write(f'{key}: `{result.get(key)}`\n\n')
              summary.write('independent_state_verification: `' + verification.get('status', 'not-run') + '`\n\n')
              summary.write('persisted_state_verified: `' + str(verification.get('persisted_state_verified') is True) + '`\n\n')
              summary.write('independent_reason_code: `' + verification.get('reason_code', 'not-run') + '`\n\n')
              summary.write('write_causality_established: `' + str(
                  verification.get('write_causality_established') is True
              ) + '`\n\n')
              if result.get('status') == 'uncertain' and result.get('write_attempts') == 1:
                  summary.write('Operator action: inspect the canonical Notion destination '
                                'before submitting any new create request. '
                                'Never treat this outcome as authorization to retry.\n\n')
              prerequisites = result.get('activation_prerequisites')
              if isinstance(prerequisites, dict):
                  known = ('Area', 'Learning Type', 'Source Link', 'Status', 'Surface Before Work?')
                  summary.write(f"required_fields_present: `{prerequisites.get('required_fields_present') is True}`\n\n")
                  for key in ('missing_owner_activation', 'missing_reviewed_metadata'):
                      value = prerequisites.get(key)
                      names = [name for name in value if name in known][:5] if isinstance(value, list) else []
                      summary.write(f'{key}: `{names}`\n\n')
          PY

name: Agent OS Bounded Lessons Learned Write

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

# Serialize this one destination across all admitted comments. Do not cancel a
# secret-bearing write. Reruns are refused by admission before credential use.
concurrency:
  group: agent-os-lessons-write-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  lessons_write:
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.issue.number == 3305 && github.event.comment.user.id == 32861845 && startsWith(github.event.comment.body, '/agent-os notion-write ')) || (github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.draft == true && github.event.pull_request.user.id == 32861845 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'issue-3305-lessons-write-20261006') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src:08_Tooling/workflow-scheduler/src:.
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Admit exact owner request without credentials
        env:
          ADMISSION_PHASE: ${{ github.event_name == 'pull_request' && 'canary-admit' || 'admit' }}
        run: |
          python -m scripts.agent_os_notion_lessons_write.runner \
            --phase "$ADMISSION_PHASE" --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/agent-os-lessons-write/admission.json"

      - name: Validate exact canary source before credential use
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python -m pip install 'PyYAML>=6.0,<7'
          python -m unittest discover -s tests/agent_os_notion_lessons_write -t . -v

      - name: Execute one bounded write and immediate canonical readback
        env:
          EXECUTION_PHASE: ${{ github.event_name == 'pull_request' && 'canary-execute' || 'execute' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AGENT_OS_LESSONS_LEARNED_DATA_SOURCE_ID: ${{ vars.AGENT_OS_LESSONS_LEARNED_DATA_SOURCE_ID }}
        run: |
          python -m scripts.agent_os_notion_lessons_write.runner \
            --phase "$EXECUTION_PHASE" --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/agent-os-lessons-write/result.json"

      - name: Publish sanitized result summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'agent-os-lessons-write'
          target = root / 'result.json'
          if not target.exists():
              target = root / 'admission.json'
          result = json.loads(target.read_text()) if target.exists() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Agent OS Lessons Learned: ' + result.get('status', 'unavailable') + '\n\n')
              for key in ('reason_code', 'write_attempts', 'readback_verified', 'page_id', 'revision', 'content_sha256'):
                  summary.write(f'{key}: `{result.get(key)}`\n\n')
          PY

      - name: Publish bounded evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-lessons-write-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-os-lessons-write/*.json
          if-no-files-found: warn
          retention-days: 3

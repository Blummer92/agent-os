name: Agent OS Validation Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-os-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run aggregate validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            08_Tooling/workflow-scheduler/requirements.txt
            08_Tooling/instructional-materials-coach/pyproject.toml
            08_Tooling/notion-navigation-client/pyproject.toml
            08_Tooling/reusable-capability-registry/pyproject.toml

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -r 08_Tooling/workflow-scheduler/requirements.txt
          python -m pip install -e "./08_Tooling/instructional-materials-coach[test]"
          python -m pip install -e "./08_Tooling/notion-navigation-client[test]"
          python -m pip install -e "./08_Tooling/reusable-capability-registry[test]"

      - name: Instrument aggregate validation integrity checks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate-all.sh")
          text = path.read_text(encoding="utf-8")
          function_anchor = "run_check() {\n"
          diagnostic = r'''diagnostic_integrity() {
            local phase="$1"
            local check_name="$2"
            local target="src/instructional_workflow_contracts/material_requirement.py"

            echo "::group::MATERIAL REQUIREMENT INTEGRITY | $phase | $check_name"
            printf 'sha1sum: '
            sha1sum "$target" || true
            printf 'git-hash-object: '
            git hash-object "$target" || true
            printf 'git-index-blob: '
            git rev-parse "HEAD:$target" || true
            stat "$target" || true
            git status --short -- "$target" || true
            git diff --no-ext-diff -- "$target" || true
            echo "::endgroup::"
          }

          '''
          if function_anchor not in text:
              raise SystemExit("run_check anchor not found")
          text = text.replace(function_anchor, diagnostic + function_anchor, 1)

          before_anchor = '''  echo "    $command_text"

          (cd "$workdir" && "$@")
          local code=$?
          '''
          after_replacement = '''  echo "    $command_text"

          diagnostic_integrity "BEFORE" "$name"
          (cd "$workdir" && "$@")
          local code=$?
          diagnostic_integrity "AFTER" "$name"
          '''
          if before_anchor not in text:
              raise SystemExit("run_check body anchor not found")
          text = text.replace(before_anchor, after_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run aggregate validation
        run: ./scripts/validate-all.sh

      - name: Publish validation summary
        if: always()
        run: |
          {
            echo "## Agent OS Validation Gate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Aggregate validation, including repository structure validation, executed in GitHub Actions."
            echo "- Cloud Build remains the canonical external comparison lane through \`cloudbuild.yaml\`."
          } >> "$GITHUB_STEP_SUMMARY"

name: Agent OS Validation Gate
run-name: ${{ inputs.ready_recovery && format('agent-os-ready-recovery:{0}:{1}', inputs.pr_number, inputs.expected_head_sha) || github.event.pull_request.title || github.workflow }}

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Draft pull request number for final-candidate validation; leave blank for diagnostic dispatch"
        required: false
        type: string
      expected_head_sha:
        description: "Exact current pull request head SHA to validate; leave blank for diagnostic dispatch"
        required: false
        type: string
      expected_workflow_sha:
        description: "Exact workflow revision for Ready recovery"
        required: false
        type: string
      ready_recovery:
        description: "Explicit Ready-PR zero-job recovery; never Draft promotion"
        required: false
        default: false
        type: boolean
      expected_main_sha:
        description: "Exact current main SHA required for Ready-PR recovery"
        required: false
        type: string
      source_validation_run_id:
        description: "Validation Gate run with action_required and zero jobs"
        required: false
        type: string
      ingress_run_id:
        description: "Governed ingress run that dispatched this recovery; empty for direct owner dispatch"
        required: false
        type: string
      ingress_trigger_id:
        description: "Logical trigger id from the ingress receipt; empty for direct owner dispatch"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: agent-os-validation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

jobs:
  plan:
    name: Run validation plan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      plan_base64: ${{ steps.plan.outputs.plan_base64 }}
      needs_node: ${{ steps.plan.outputs.needs_node }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute canonical validation plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$HEAD_SHA" ]; then
            echo "checked-out SHA $checked_out_sha does not match pull request head $HEAD_SHA" >&2
            exit 1
          fi
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          if [ ! -s "$RUNNER_TEMP/changed-files.txt" ]; then
            echo "pull request changed-file set is empty" >&2
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          import json
          import os
          from pathlib import Path
          from scripts.agent_os_remote_validation import (
              SelectionInput,
              load_rule_map,
              select_validation_plan,
              serialize_validation_plan,
          )

          changed = tuple(
              line for line in Path(os.environ["RUNNER_TEMP"], "changed-files.txt").read_text().splitlines()
              if line
          )
          plan = select_validation_plan(
              SelectionInput(
                  repository=os.environ["GITHUB_REPOSITORY"],
                  pull_request=int(os.environ["PR_NUMBER"]),
                  base_sha=os.environ["BASE_SHA"],
                  head_sha=os.environ["HEAD_SHA"],
                  changed_files=changed,
              ),
              load_rule_map(),
          )
          payload = serialize_validation_plan(plan)
          encoded = base64.urlsafe_b64encode(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          ).decode("ascii")
          print(f"profile={plan.profile}")
          print(f"plan_base64={encoded}")
          print(
              "needs_node=" +
              str(any("picture-perfect-coach" in command for command in plan.commands)).lower()
          )
          PY

      - name: Fail closed on manual review
        if: ${{ steps.plan.outputs.profile == 'manual-review' }}
        run: |
          echo "Canonical validation selector requires manual review; refusing to infer a validation command set." >&2
          exit 1

      - name: Set up Python for focused validation
        if: ${{ steps.plan.outputs.profile == 'focused' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            08_Tooling/workflow-scheduler/requirements.txt
            08_Tooling/instructional-materials-coach/pyproject.toml
            08_Tooling/notion-navigation-client/pyproject.toml

      - name: Install focused validation dependencies
        if: ${{ steps.plan.outputs.profile == 'focused' }}
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -r 08_Tooling/workflow-scheduler/requirements.txt
          python -m pip install -e "./08_Tooling/instructional-materials-coach[test]"
          python -m pip install -e "./08_Tooling/notion-navigation-client[test]"

      - name: Set up Node for focused validation
        if: ${{ steps.plan.outputs.profile == 'focused' && steps.plan.outputs.needs_node == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 08_Tooling/instructional-materials-coach/picture-perfect-coach/package-lock.json

      - name: Install Picture Perfect Coach dependencies
        if: ${{ steps.plan.outputs.profile == 'focused' && steps.plan.outputs.needs_node == 'true' }}
        working-directory: 08_Tooling/instructional-materials-coach/picture-perfect-coach
        run: npm ci

      - name: Run focused validation plan
        if: ${{ steps.plan.outputs.profile == 'focused' }}
        env:
          PLAN_BASE64: ${{ steps.plan.outputs.plan_base64 }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/agent_os_ci_validation.py \
            --plan-base64 "$PLAN_BASE64" \
            --expected-head-sha "$EXPECTED_HEAD_SHA"

      - name: Publish PR validation-plan summary
        if: always()
        env:
          PROFILE: ${{ steps.plan.outputs.profile }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tested_sha="$(git rev-parse HEAD)"
          {
            echo "## Agent OS PR Validation Plan"
            echo
            echo "- Pull request head SHA: \`$PR_HEAD_SHA\`"
            echo "- Tested checkout SHA: \`$tested_sha\`"
            echo "- Canonical profile: \`${PROFILE:-unavailable}\`"
            if [ "$PROFILE" = "static" ]; then
              echo "- Static profile selected; no Python test command executed."
            elif [ "$PROFILE" = "focused" ]; then
              echo "- Only the canonical focused command set executed."
            elif [ "$PROFILE" = "aggregate" ]; then
              echo "- Aggregate profile selected; Draft PR events defer authoritative aggregate validation to explicit exact-head final-candidate admission."
            elif [ "$PROFILE" = "manual-review" ]; then
              echo "- Manual review required; validation failed closed."
            fi
            echo "- Static/focused evidence is non-final; Ready-for-Review still requires one exact-head aggregate."
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Run aggregate validation
    # Deliberately not `needs: plan`. The plan job owns only the cheap
    # developer-loop lane; #2132 already established that the profile has no say
    # in whether the authoritative aggregate runs, so the two jobs share no data.
    # A `needs:` edge would only serialize the aggregate behind the plan job
    # (measured: ~11-16s for an aggregate-profile PR, ~56s for a focused-profile
    # PR, whose plan job re-installs the same dependency set the aggregate
    # installs again). Running them concurrently preserves the focused
    # developer-loop signal while removing it from the Ready-path critical path.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    concurrency:
      # Serialize manual dispatch jobs using trusted event identity.
      group: agent-os-validation-dispatch-${{ github.event_name == 'workflow_dispatch' && format('repository-{0}', github.repository_id) || format('run-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level override replaces the workflow permissions, so the read grants
    # are restated. `statuses: write` is only for the canonical
    # `agent-os/authoritative-aggregate` commit status (#2589).
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      statuses: write
    env:
      MAX_READY_RECOVERY_ATTEMPTS: "2"
    outputs:
      authoritative: ${{ steps.authority.outputs.authoritative }}
      head_sha: ${{ steps.authority.outputs.head_sha }}
      reused: ${{ steps.aggregate_evidence.outputs.run_required == 'false' }}
      aggregate_outcome: ${{ steps.aggregate.outcome }}
      main_health_outcome: ${{ steps.main_health.outcome }}
      main_recovery_stop_outcome: ${{ steps.main_recovery_stop.outcome }}
    steps:
      - name: Check out workflow source for ingress verification
        # #2410: only an ingress-origin recovery needs scripts/ before
        # admission; every other dispatch path is unchanged and pays no
        # checkout. The checkout ref is the dispatch ref (main), so the
        # verifier is the same revision as the running workflow.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ingress_run_id != '' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Admit exact-head Draft final candidate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          READY_RECOVERY: ${{ inputs.ready_recovery }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          SOURCE_VALIDATION_RUN_ID: ${{ inputs.source_validation_run_id }}
          INGRESS_RUN_ID: ${{ inputs.ingress_run_id }}
          INGRESS_TRIGGER_ID: ${{ inputs.ingress_trigger_id }}
        run: |
          set -euo pipefail

          if [ "$READY_RECOVERY" != "true" ] && [ "$READY_RECOVERY" != "false" ]; then
            echo "invalid Ready-recovery flag" >&2
            exit 1
          fi
          if [ "$READY_RECOVERY" != "true" ] &&
             { [ -n "$EXPECTED_MAIN_SHA" ] || [ -n "$SOURCE_VALIDATION_RUN_ID" ] || [ -n "$EXPECTED_WORKFLOW_SHA" ]; }; then
            echo "Ready-recovery evidence supplied without explicit recovery mode" >&2
            exit 1
          fi

          if [ -z "$PR_NUMBER" ] && [ -z "$EXPECTED_HEAD_SHA" ]; then
            if [ "$READY_RECOVERY" = "true" ]; then
              echo "Ready recovery requires PR and exact head" >&2
              exit 1
            fi
            echo "mode=diagnostic" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_NUMBER" ] || [ -z "$EXPECTED_HEAD_SHA" ]; then
            echo "pr_number and expected_head_sha must be provided together for final-candidate validation" >&2
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr_number must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_head_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid,baseRefOid,baseRefName,headRefName)"
          state="$(jq -r '.state' <<<"$pr_json")"
          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          current_head="$(jq -r '.headRefOid' <<<"$pr_json")"
          current_base="$(jq -r '.baseRefOid' <<<"$pr_json")"

          if [ "$state" != "OPEN" ]; then
            echo "final-candidate PR must be open" >&2
            exit 1
          fi
          if [ "$READY_RECOVERY" != "true" ]; then
            if [ "$is_draft" != "true" ]; then
              echo "final-candidate dispatch is only for a Draft PR" >&2
              exit 1
            fi
          fi
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "stale final-candidate request: expected $EXPECTED_HEAD_SHA but current PR head is $current_head" >&2
            exit 1
          fi
          if [ "$READY_RECOVERY" = "true" ]; then
            if ! [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Ready recovery requires exact workflow SHA" >&2
              exit 1
            fi
            if [ "$GITHUB_SHA" != "$EXPECTED_WORKFLOW_SHA" ]; then
              echo "Ready recovery workflow revision mismatch" >&2
              exit 1
            fi
            if [ "$GITHUB_REF_TYPE" != "branch" ]; then
              echo "Ready recovery requires an identified workflow branch" >&2
              exit 1
            fi
            actual_workflow_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha'
            )"
            if [ "$actual_workflow_sha" != "$EXPECTED_WORKFLOW_SHA" ]; then
              echo "Ready recovery workflow branch changed" >&2
              exit 1
            fi
          elif [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "final-candidate dispatch SHA $GITHUB_SHA does not match admitted candidate $EXPECTED_HEAD_SHA; dispatch the workflow on a ref resolving to the exact PR head" >&2
            exit 1
          fi

          if [ "$READY_RECOVERY" = "true" ]; then
            if [ "$is_draft" != "false" ]; then
              echo "Ready recovery requires an already-Ready PR" >&2
              exit 1
            fi
            # #2410 ingress-origin recovery: the two correlation inputs must
            # arrive together, the dispatch actor must be the governed
            # ingress job's token identity, and the ingress run plus receipt
            # are verified independently below. Supplying ingress inputs
            # never upgrades a direct dispatch: an owner actor with ingress
            # inputs fails the token-identity check, and a bot actor without
            # verified ingress evidence fails the owner check.
            if [ -n "$INGRESS_RUN_ID" ] || [ -n "$INGRESS_TRIGGER_ID" ]; then
              if [ -z "$INGRESS_RUN_ID" ] || [ -z "$INGRESS_TRIGGER_ID" ]; then
                echo "Ingress recovery requires both ingress run id and trigger id" >&2
                exit 1
              fi
              if ! [[ "$INGRESS_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
                echo "Ingress run id must be a positive integer" >&2
                exit 1
              fi
              if ! [[ "$INGRESS_TRIGGER_ID" =~ ^issue-comment-trigger:[0-9a-f]{64}$ ]]; then
                echo "Ingress trigger id has an invalid shape" >&2
                exit 1
              fi
              if [ "$GITHUB_ACTOR" != "github-actions[bot]" ]; then
                echo "Ingress recovery requires the governed ingress token identity" >&2
                exit 1
              fi
            elif [ "$GITHUB_ACTOR" != "${GITHUB_REPOSITORY%%/*}" ]; then
              echo "Ready recovery requires repository-owner dispatch" >&2
              exit 1
            fi
            if ! [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Ready recovery requires an exact main SHA" >&2
              exit 1
            fi
            if ! [[ "$SOURCE_VALIDATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Ready recovery requires a numeric source run ID" >&2
              exit 1
            fi

            current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            base_name="$(jq -r .baseRefName <<<"$pr_json")"
            head_name="$(jq -r .headRefName <<<"$pr_json")"

            if [ "$current_main" != "$EXPECTED_MAIN_SHA" ] ||
               [ "$current_base" != "$EXPECTED_MAIN_SHA" ] ||
               [ "$base_name" != "main" ]; then
              echo "Ready recovery rejected: main/base identity changed" >&2
              exit 1
            fi

            expected_workflow_id="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/agent-os-validation.yml" --jq .id
            )"
            if ! [[ "$expected_workflow_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "Canonical workflow identity unavailable" >&2
              exit 1
            fi
            source_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_VALIDATION_RUN_ID")"
            if ! jq -e               --arg sha "$EXPECTED_HEAD_SHA"               --arg branch "$head_name"               --argjson pr "$PR_NUMBER" \
              --argjson workflow_id "$expected_workflow_id"               '
                .status == "completed" and
                .conclusion == "action_required" and
                .event == "pull_request" and
                .head_sha == $sha and
                .head_branch == $branch and
                .workflow_id == $workflow_id and
                .path == ".github/workflows/agent-os-validation.yml" and
                (
                  (.pull_requests // []) as $prs |
                  (($prs | length) > 0 and
                   any($prs[]; .number == $pr))
                )
              ' <<<"$source_json" >/dev/null; then
              echo "Ready recovery source run identity rejected" >&2
              exit 1
            fi

            job_count="$(
              gh api                 "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_VALIDATION_RUN_ID/jobs?per_page=1"                 --jq .total_count
            )"
            if [ "$job_count" != "0" ]; then
              echo "Ready recovery source actually executed jobs" >&2
              exit 1
            fi

            # #2410 ingress-origin recovery: independently verify the trusted
            # transport before the attempt bound is consulted. The
            # caller-supplied run/trigger ids are correlation hints only;
            # the run record and the receipt artifact are fetched from
            # GitHub and re-checked by scripts/agent_os_ready_recovery_ingress.py.
            if [ -n "$INGRESS_RUN_ID" ]; then
              ingress_tmp="$RUNNER_TEMP/agent-os-ready-recovery-ingress"
              mkdir -p "$ingress_tmp"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INGRESS_RUN_ID" > "$ingress_tmp/ingress-run.json"
              governed_workflow_id="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/agent-os-governed-invocation.yml" --jq .id
              )"
              if ! [[ "$governed_workflow_id" =~ ^[1-9][0-9]*$ ]]; then
                echo "Governed ingress workflow identity unavailable" >&2
                exit 1
              fi
              artifact_ids="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INGRESS_RUN_ID/artifacts?per_page=100" \
                  --jq '.artifacts[] | select(.name | startswith("agent-os-ready-recovery-'"$INGRESS_RUN_ID"'-")) | .id'
              )"
              artifact_count="$(printf '%s' "$artifact_ids" | grep -c . || true)"
              if [ "$artifact_count" != "1" ]; then
                echo "Ingress recovery requires exactly one ready-recovery receipt artifact" >&2
                exit 1
              fi
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_ids/zip" > "$ingress_tmp/ingress-receipt.zip"
              python3 -m zipfile -e "$ingress_tmp/ingress-receipt.zip" "$ingress_tmp/artifact"
              if [ ! -f "$ingress_tmp/artifact/receipt.json" ] || [ ! -f "$ingress_tmp/artifact/transport.json" ]; then
                echo "Ingress receipt artifact is missing receipt or transport evidence" >&2
                exit 1
              fi
              python3 scripts/agent_os_ready_recovery_ingress.py verify \
                --run "$ingress_tmp/ingress-run.json" \
                --receipt "$ingress_tmp/artifact/receipt.json" \
                --transport "$ingress_tmp/artifact/transport.json" \
                --repository "$GITHUB_REPOSITORY" \
                --pr-number "$PR_NUMBER" \
                --expected-head-sha "$EXPECTED_HEAD_SHA" \
                --expected-main-sha "$EXPECTED_MAIN_SHA" \
                --expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
                --source-run-id "$SOURCE_VALIDATION_RUN_ID" \
                --trigger-id "$INGRESS_TRIGGER_ID" \
                --ingress-run-id "$INGRESS_RUN_ID" \
                --validation-run-id "$GITHUB_RUN_ID" \
                --governed-workflow-id "$governed_workflow_id" \
                --owner-login "${GITHUB_REPOSITORY%%/*}" \
                --service-actor 'chatgpt-codex-connector[bot]'
            fi

            # Count immutable GitHub workflow-run records, including
            # unsuccessful attempts. Never trust a caller's retry count.
            recovery_title="agent-os-ready-recovery:$PR_NUMBER:$EXPECTED_HEAD_SHA"

            run_records="$(
              gh api --paginate                 "repos/$GITHUB_REPOSITORY/actions/workflows/agent-os-validation.yml/runs?event=workflow_dispatch&per_page=100"                 --jq '.workflow_runs[] | [.id, .display_title] | @tsv'
            )"

            recovery_attempts=0
            current_run_found=false

            while IFS=$'\t' read -r run_id run_title; do
              if [ "$run_title" = "$recovery_title" ]; then
                recovery_attempts=$((recovery_attempts + 1))
                if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
                  current_run_found=true
                fi
              fi
            done <<< "$run_records"

            if [ "$current_run_found" != "true" ]; then
              echo "Ready recovery run history is not current or complete" >&2
              exit 1
            fi

            if [ "$recovery_attempts" -gt "$MAX_READY_RECOVERY_ATTEMPTS" ]; then
              echo "Ready recovery attempt bound exhausted" >&2
              exit 1
            fi

            echo "Ready recovery attempt $recovery_attempts/$MAX_READY_RECOVERY_ATTEMPTS"
            echo "mode=ready-recovery" >> "$GITHUB_OUTPUT"
          else
            echo "mode=final-candidate" >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$current_head" >> "$GITHUB_OUTPUT"
          echo "base_sha=$current_base" >> "$GITHUB_OUTPUT"

      - name: Resolve authoritative candidate identity
        id: authority
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_MODE: ${{ steps.candidate.outputs.mode }}
          DISPATCH_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Only non-Draft PR runs and admitted final-candidate dispatches are
          # authoritative. Diagnostic dispatch and main pushes never publish.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "authoritative=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && { [ "$DISPATCH_MODE" = "final-candidate" ] || [ "$DISPATCH_MODE" = "ready-recovery" ]; }; then
            echo "authoritative=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=$DISPATCH_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "authoritative=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse valid exact-head aggregate evidence
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        id: aggregate_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Only the newest `agent-os/authoritative-aggregate` status for this
          # exact SHA governs (#2761): an older success never masks a newer
          # failure/error/pending, and check-run history is not consulted.
          evidence_state="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" \
              --jq '[.[] | select(.context == "agent-os/authoritative-aggregate")]
                | sort_by(.id)
                | last
                | .state // "missing"'
          )"
          echo "state=$evidence_state" >> "$GITHUB_OUTPUT"
          case "$evidence_state" in
            success)
              echo "run_required=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run_required=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publish authoritative aggregate pending status
        if: ${{ steps.authority.outputs.authoritative == 'true' && steps.aggregate_evidence.outputs.run_required != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ steps.authority.outputs.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state=pending \
            -f context=agent-os/authoritative-aggregate \
            -f description="Authoritative aggregate validation running on this exact head" \
            -f target_url="$TARGET_URL"

      - name: Check out repository
        if: ${{ steps.aggregate_evidence.outputs.run_required != 'false' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check out admitted candidate commit
        if: ${{ steps.aggregate_evidence.outputs.run_required != 'false' && github.event_name == 'workflow_dispatch' && (steps.candidate.outputs.mode == 'final-candidate' || steps.candidate.outputs.mode == 'ready-recovery') }}
        env:
          CANDIDATE_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CANDIDATE_HEAD_SHA"
          git checkout --detach "$CANDIDATE_HEAD_SHA"

      - name: Verify aggregate checkout identity
        if: ${{ steps.aggregate_evidence.outputs.run_required != 'false' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          DISPATCH_MODE: ${{ steps.candidate.outputs.mode }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$checked_out_sha" != "$PR_HEAD_SHA" ]; then
            echo "checked-out SHA $checked_out_sha does not match pull request head $PR_HEAD_SHA" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_MODE" = "final-candidate" ] && [ "$checked_out_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "checked-out SHA $checked_out_sha does not match admitted candidate $EXPECTED_HEAD_SHA" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_MODE" = "ready-recovery" ] && [ "$checked_out_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Ready recovery checked out the wrong candidate SHA" >&2
            exit 1
          fi

      - name: Recover missing exact-current main aggregate evidence
        if: ${{ steps.aggregate_evidence.outputs.run_required != 'false' && github.event_name == 'pull_request' }}
        id: main_evidence_recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if ! [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "current main SHA is unavailable or malformed" >&2
            exit 1
          fi

          # Count only authoritative main-health evidence (#3461): a bare
          # name/SHA match would treat wrong-ref dispatch checks as evidence
          # and skip a needed recovery dispatch.
          check_count="$(
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/commits/$current_main_sha/check-runs?check_name=Run%20aggregate%20validation&per_page=100"               | MAIN_HEALTH_SHA="$current_main_sha" python3 scripts/agent_os_remote_validation/main_health_check_selector.py --count
          )"
          if [ "$check_count" != "0" ]; then
            echo "recovery_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Exact-current main $current_main_sha has no aggregate evidence; dispatching the existing validation authority on that exact ref."
          gh workflow run agent-os-validation.yml --ref "$current_main_sha"
          echo "recovery_required=true" >> "$GITHUB_OUTPUT"
          echo "main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"

      - name: Stop candidate while exact-current main recovery runs
        id: main_recovery_stop
        if: ${{ steps.main_evidence_recovery.outputs.recovery_required == 'true' }}
        env:
          RECOVERY_MAIN_SHA: ${{ steps.main_evidence_recovery.outputs.main_sha }}
        run: |
          echo "Exact-current main aggregate evidence was missing for $RECOVERY_MAIN_SHA." >&2
          echo "A diagnostic Agent OS Validation Gate run was dispatched on that exact SHA." >&2
          echo "Candidate validation remains fail-closed until the recovered main evidence is terminal and successful; rerun this failed job afterward." >&2
          exit 1

      - name: Project exact-current main health
        if: ${{ steps.aggregate_evidence.outputs.run_required != 'false' && steps.main_evidence_recovery.outputs.recovery_required != 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (steps.candidate.outputs.mode == 'final-candidate' || steps.candidate.outputs.mode == 'ready-recovery'))) }}
        id: main_health
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
          CANDIDATE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || steps.candidate.outputs.head_sha }}
          CANDIDATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.candidate.outputs.base_sha }}
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if ! [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "current main SHA is unavailable or malformed" >&2
            exit 1
          fi

          gh api --paginate             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100"             --jq '.[].filename' > "$RUNNER_TEMP/main-health-changed-files.txt"
          if [ ! -s "$RUNNER_TEMP/main-health-changed-files.txt" ]; then
            echo "pull request changed-file set is empty" >&2
            exit 1
          fi

          # A current-main aggregate can still be legitimately in flight when this
          # candidate reaches the gate (#3351 / #3335 chronology). Give that
          # already-running exact-main authority a bounded opportunity to become
          # terminal instead of manufacturing a transient red Actions result.
          # The existing classification below remains authoritative after the
          # wait; timeout therefore still projects validation-pending fail-closed.
          main_health_wait_seconds=900
          main_health_poll_seconds=30
          main_health_elapsed_seconds=0

          while true; do
            # Evidence-provenance filter (#3461): select only checks whose
            # workflow run is a push to main or a sanctioned diagnostic
            # dispatch by the validation workflow itself. Wrong-ref
            # final-candidate dispatch checks are never main-health evidence.
            check_json="$(
              gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/commits/$current_main_sha/check-runs?check_name=Run%20aggregate%20validation&per_page=100"               | MAIN_HEALTH_SHA="$current_main_sha" python3 scripts/agent_os_remote_validation/main_health_check_selector.py
            )"

            check_status="$(jq -r '.status // "missing"' <<<"$check_json")"
            if [ "$check_status" != "queued" ] && [ "$check_status" != "in_progress" ]; then
              break
            fi
            if [ "$main_health_elapsed_seconds" -ge "$main_health_wait_seconds" ]; then
              break
            fi

            remaining_seconds=$((main_health_wait_seconds - main_health_elapsed_seconds))
            sleep_seconds="$main_health_poll_seconds"
            if [ "$remaining_seconds" -lt "$sleep_seconds" ]; then
              sleep_seconds="$remaining_seconds"
            fi
            echo "Exact-current main validation is $check_status; waiting ${sleep_seconds}s before rechecking."
            sleep "$sleep_seconds"
            main_health_elapsed_seconds=$((main_health_elapsed_seconds + sleep_seconds))
          done

          check_conclusion="$(jq -r '.conclusion // ""' <<<"$check_json")"
          details_url="$(jq -r '.details_url // ""' <<<"$check_json")"
          evidence_sha="$current_main_sha"
          validation_conclusion="missing"

          case "$check_status" in
            queued|in_progress)
              validation_conclusion="pending"
              ;;
            completed)
              case "$check_conclusion" in
                success)
                  validation_conclusion="success"
                  ;;
                cancelled)
                  validation_conclusion="cancelled"
                  ;;
                failure)
                  validation_conclusion="infrastructure-failure"
                  if [[ "$details_url" =~ /job/([0-9]+) ]]; then
                    job_id="${BASH_REMATCH[1]}"
                    aggregate_step_conclusion="$(
                      gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id"                         --jq '[.steps[]? | select(.name == "Run aggregate validation") | .conclusion] | last // ""'
                    )"
                    if [ "$aggregate_step_conclusion" = "failure" ]; then
                      validation_conclusion="repository-failure"
                    fi
                  fi
                  ;;
                *)
                  validation_conclusion="infrastructure-failure"
                  ;;
              esac
              ;;
            missing)
              evidence_sha=""
              validation_conclusion="missing"
              ;;
            *)
              validation_conclusion="infrastructure-failure"
              ;;
          esac

          export CURRENT_MAIN_SHA="$current_main_sha"
          recovery_requested=false
          if [ "$validation_conclusion" = "repository-failure" ] && \
             [ "$CANDIDATE_BASE_SHA" = "$current_main_sha" ]; then
            recovery_issue_number="$(
              gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' |
              python3 -c 'import sys; from scripts.agent_os_remote_validation.main_health_recovery_authorization import recovery_issue_reference; value=recovery_issue_reference(sys.stdin.read()); print(value or "")'
            )"
            if [ -n "$recovery_issue_number" ]; then
              recovery_issue_json="$(gh api "/repos/$GITHUB_REPOSITORY/issues/$recovery_issue_number")"
              recovery_issue_body="$(jq -r '.body // ""' <<<"$recovery_issue_json")"
              recovery_issue_author="$(jq -r '.user.login // ""' <<<"$recovery_issue_json")"
              repository_owner="${GITHUB_REPOSITORY%%/*}"
              export RECOVERY_ISSUE_NUMBER="$recovery_issue_number"
              export RECOVERY_ISSUE_BODY="$recovery_issue_body"
              export RECOVERY_ISSUE_AUTHOR="$recovery_issue_author"
              export REPOSITORY_OWNER="$repository_owner"
              export MAIN_CHECK_DETAILS_URL="$details_url"
              recovery_requested="$(
                python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.agent_os_remote_validation.main_health_recovery_authorization import (
              evaluate_recovery_authorization,
          )

          authorization = evaluate_recovery_authorization(
              os.environ["RECOVERY_ISSUE_BODY"],
              repository=os.environ["GITHUB_REPOSITORY"],
              repository_owner=os.environ["REPOSITORY_OWNER"],
              issue_number=int(os.environ["RECOVERY_ISSUE_NUMBER"]),
              issue_author=os.environ["RECOVERY_ISSUE_AUTHOR"],
              current_main_sha=os.environ["CURRENT_MAIN_SHA"],
              pull_request=int(os.environ["PR_NUMBER"]),
              current_head_sha=os.environ["CANDIDATE_HEAD_SHA"],
              main_check_details_url=os.environ["MAIN_CHECK_DETAILS_URL"],
              changed_files=tuple(
                  line for line in Path(
                      os.environ["RUNNER_TEMP"], "main-health-changed-files.txt"
                  ).read_text(encoding="utf-8").splitlines() if line
              ),
          )
          print("true" if authorization is not None else "false")
          PY
              )"
            fi
            if [ "$recovery_requested" != "true" ]; then
              echo "recovery authorization rejected for issue $recovery_issue_number" >&2
            fi
          fi

          export CURRENT_MAIN_SHA="$current_main_sha"
          export EVIDENCE_SHA="$evidence_sha"
          export VALIDATION_CONCLUSION="$validation_conclusion"
          export RECOVERY_REQUESTED="$recovery_requested"
          export CANDIDATE_BASE_SHA
          export CANDIDATE_HEAD_SHA
          export PR_NUMBER

          echo "main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"
          echo "validation_conclusion=$validation_conclusion" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import os
          from pathlib import Path

          from scripts.agent_os_remote_validation import (
              SelectionInput,
              load_rule_map,
              select_validation_plan,
          )
          from scripts.agent_os_remote_validation.main_health import project_main_health
          from scripts.agent_os_remote_validation.main_health_admission import (
              evaluate_final_validation_admission,
          )

          changed = tuple(
              line
              for line in Path(
                  os.environ["RUNNER_TEMP"],
                  "main-health-changed-files.txt",
              ).read_text(encoding="utf-8").splitlines()
              if line
          )
          # The plan is evaluated against exact-current main, not the candidate's
          # possibly stale recorded base. #2236 requires the projected health SHA,
          # the admission base, and the plan base to describe the same main; using
          # the recorded base would report `main-health.evidence-stale` for every
          # candidate whose base is merely behind, which is branch drift rather
          # than a main-health failure. The candidate's changed-file set still
          # selects the profile, so candidate attribution is unchanged.
          plan = select_validation_plan(
              SelectionInput(
                  repository=os.environ["GITHUB_REPOSITORY"],
                  pull_request=int(os.environ["PR_NUMBER"]),
                  base_sha=os.environ["CURRENT_MAIN_SHA"],
                  head_sha=os.environ["CANDIDATE_HEAD_SHA"],
                  changed_files=changed,
              ),
              load_rule_map(),
          )
          health = project_main_health(
              repository=os.environ["GITHUB_REPOSITORY"],
              current_main_sha=os.environ["CURRENT_MAIN_SHA"],
              evidence_sha=os.environ["EVIDENCE_SHA"] or None,
              validation_conclusion=os.environ["VALIDATION_CONCLUSION"],
              recovery_requested=os.environ["RECOVERY_REQUESTED"] == "true",
          )
          admission = evaluate_final_validation_admission(
              plan,
              None,
              main_health=health,
              current_base_sha=os.environ["CURRENT_MAIN_SHA"],
              current_head_sha=os.environ["CANDIDATE_HEAD_SHA"],
          )

          # This gate owns exactly one question: is exact-current main healthy
          # enough to spend candidate aggregate cycles? #2236 answers it by
          # blocking with a `main-health.*` reason, which is the only thing that
          # may freeze this run:
          #   main-health.exact-main-red
          #   main-health.validation-missing
          #   main-health.validation-pending
          #   main-health.validation-cancelled
          #   main-health.infrastructure-unproven
          #   main-health.evidence-invalid
          #   main-health.evidence-stale
          #   main-health.repository-mismatch
          #
          # Every other disposition describes the candidate's own validation
          # obligation, not main health: healthy main yields `require-aggregate`
          # (the aggregate this job is about to run), `admission.focused-evidence-missing`
          # for a focused plan, or `admission.selector-manual-review`. Treating
          # those as failures froze candidates while main was green, so they pass
          # through to the existing downstream owners unchanged.
          main_health_blockers = tuple(
              reason for reason in admission.reason_codes if reason.startswith("main-health.")
          )
          if main_health_blockers:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("reason_codes=" + ",".join(main_health_blockers) + "\n")
              raise SystemExit(
                  "ordinary final candidate aggregate blocked by exact-current main health: "
                  + ",".join(main_health_blockers)
              )
          PY

      - name: Set up Python
        if: ${{ steps.aggregate_evidence.outputs.run_required != 'false' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            08_Tooling/workflow-scheduler/requirements.txt
            08_Tooling/instructional-materials-coach/pyproject.toml
            08_Tooling/notion-navigation-client/pyproject.toml

      - name: Install validation dependencies
        if: ${{ steps.aggregate_evidence.outputs.run_required != 'false' }}
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pip install -r 08_Tooling/workflow-scheduler/requirements.txt
          python -m pip install -e "./08_Tooling/instructional-materials-coach[test]"
          python -m pip install -e "./08_Tooling/notion-navigation-client[test]"

      - name: Run aggregate validation
        id: aggregate
        if: ${{ steps.aggregate_evidence.outputs.run_required != 'false' }}
        run: ./scripts/validate-all.sh

      - name: Publish validation summary
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          DISPATCH_MODE: ${{ steps.candidate.outputs.mode }}
          RUN_REQUIRED: ${{ steps.aggregate_evidence.outputs.run_required }}
          REUSE_STATE: ${{ steps.aggregate_evidence.outputs.state }}
          MAIN_HEALTH_OUTCOME: ${{ steps.main_health.outcome }}
          MAIN_HEALTH_CONCLUSION: ${{ steps.main_health.outputs.validation_conclusion }}
          MAIN_HEALTH_REASONS: ${{ steps.main_health.outputs.reason_codes }}
          MAIN_RECOVERY_STOP_OUTCOME: ${{ steps.main_recovery_stop.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          tested_sha="not-executed-in-this-run"
          if [ "${RUN_REQUIRED:-true}" != "false" ]; then
            tested_sha="$(git rev-parse HEAD)"
          fi
          {
            echo "## Agent OS Validation Gate"
            echo
            echo "- Workflow run SHA: \`$GITHUB_SHA\`"
            echo "- Tested checkout SHA: \`$tested_sha\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "- Pull request head SHA: \`$PR_HEAD_SHA\`"
            fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              if [ "$DISPATCH_MODE" = "final-candidate" ]; then
                echo "- Admitted candidate SHA: \`$DISPATCH_HEAD_SHA\`"
              elif [ "$DISPATCH_MODE" = "ready-recovery" ]; then
                echo "- Admitted candidate SHA: \`$DISPATCH_HEAD_SHA\`"
              fi
              echo "- Dispatch mode: \`${DISPATCH_MODE:-diagnostic}\`"
            fi
            if [ "${MAIN_HEALTH_OUTCOME:-}" = "failure" ]; then
              echo "- Failure class: \`main-health-admission\` (reason: \`${MAIN_HEALTH_REASONS:-unreported}\`; exact-current main validation: \`${MAIN_HEALTH_CONCLUSION:-unreported}\`). Candidate aggregate tests were not executed and did not establish this failure."
            elif [ "${MAIN_RECOVERY_STOP_OUTCOME:-}" = "failure" ]; then
              echo "- Failure class: \`main-health-admission\` (reason: \`main-health.validation-missing\`; exact-current main recovery dispatched). Candidate aggregate tests were not executed and did not establish this failure."
            elif [ "${AGGREGATE_OUTCOME:-}" = "failure" ]; then
              echo "- Failure class: \`candidate-aggregate\`. Candidate aggregate tests executed and failed."
            fi
            if [ "${RUN_REQUIRED:-true}" = "false" ]; then
              echo "- Existing exact-head aggregate evidence was reused (state: \`${REUSE_STATE:-unknown}\`); duplicate aggregate execution was skipped."
            elif [ "${AGGREGATE_OUTCOME:-}" = "success" ] || [ "${AGGREGATE_OUTCOME:-}" = "failure" ]; then
              echo "- Aggregate validation, including repository structure validation, executed in GitHub Actions."
            else
              echo "- Candidate aggregate validation was not executed in this run (outcome: \`${AGGREGATE_OUTCOME:-not-reached}\`)."
            fi
            echo "- Static/focused PR evidence never substitutes for this authoritative exact-head aggregate."
          } >> "$GITHUB_STEP_SUMMARY"


  jscpd-advisory:
    name: jscpd duplicate-code advisory
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate report-only jscpd evidence
        continue-on-error: true
        run: python -m scripts.jscpd_advisory --output tmp/jscpd-advisory --sha "${{ github.event.pull_request.head.sha }}"
      - name: Upload advisory evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-advisory-${{ github.event.pull_request.number }}
          path: tmp/jscpd-advisory/
          if-no-files-found: ignore
          retention-days: 7

  pyan3-advisory:
    name: pyan3 call-graph advisory
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Pyan3
        run: python -m pip install "pyan3==2.9.0"
      - name: Generate report-only pyan3 evidence
        continue-on-error: true
        run: python -m scripts.pyan3_advisory --output tmp/pyan3-advisory --sha "${{ github.event.pull_request.head.sha }}"
      - name: Upload advisory evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pyan3-advisory-${{ github.event.pull_request.number }}
          path: tmp/pyan3-advisory/
          if-no-files-found: ignore
          retention-days: 7

  aggregate-gate:
    # Terminal disposition only when authoritative aggregate validation is
    # required. Ordinary Draft PR events intentionally defer the aggregate and
    # therefore skip this terminal gate rather than publishing a false failure.
    # Ready/non-Draft PRs, workflow_dispatch, and main pushes still run the gate.
    # Once admitted, the gate remains fail-closed: only an exact aggregate
    # `success` opens it, so skipped/missing/failure/cancelled aggregate evidence
    # can never become merge/Ready authority (#3114).
    name: Agent OS aggregate gate
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [plan, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Publish terminal authoritative aggregate status
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITATIVE: ${{ needs.validate.outputs.authoritative }}
          REUSED: ${{ needs.validate.outputs.reused }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          AGGREGATE_OUTCOME: ${{ needs.validate.outputs.aggregate_outcome }}
          MAIN_HEALTH_OUTCOME: ${{ needs.validate.outputs.main_health_outcome }}
          MAIN_RECOVERY_STOP_OUTCOME: ${{ needs.validate.outputs.main_recovery_stop_outcome }}
          STATUS_SHA: ${{ needs.validate.outputs.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          decision="$(python3 scripts/agent_os_aggregate_gate.py status)"
          if [ -z "$decision" ]; then
            echo "No authoritative aggregate status to publish for this run."
            exit 0
          fi
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state="$(jq -r .state <<<"$decision")" \
            -f context=agent-os/authoritative-aggregate \
            -f description="$(jq -r .description <<<"$decision")" \
            -f target_url="$TARGET_URL"
      - name: Enforce authoritative aggregate disposition
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: python3 scripts/agent_os_aggregate_gate.py

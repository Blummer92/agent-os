name: Agent OS Governed Invocation Ingress

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-os-ingress-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false

# Wave 1 (GCE retirement): the host-install activation step that consumed
# this value was retired. The literal remains exactly once, solely as the
# expected-source-SHA anchor for the surviving read-only sudo-admission
# inspection (sudo_admission_inspection.expected_runtime_source_sha),
# which fails closed without exactly one pin. Nothing in this workflow
# installs a host runtime anymore.
env:
  HOST_RUNTIME_SOURCE_SHA: 36ccd1715b8b11e30f8d92196b8e7f0791c10547

jobs:
  ingress:
    name: Validate and transport bounded Agent OS invocation
    if: ${{ github.event.issue.pull_request == null && !startsWith(github.event.comment.body, '/agent-os ready-admit') && !startsWith(github.event.comment.body, '/agent-os merge-admit') && !startsWith(github.event.comment.body, '/agent-os validate-draft') && !startsWith(github.event.comment.body, '/agent-os recover-ready') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical workflow source
        uses: actions/checkout@v7

      - name: Parse low-trust issue comment envelope
        id: transport
        run: |
          mkdir -p "$RUNNER_TEMP/agent-os-ingress"
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.github_issue_comment_ingress \
              --event "$GITHUB_EVENT_PATH" \
              --repository "$GITHUB_REPOSITORY" \
              --allowed-actor Blummer92 \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$RUNNER_TEMP/agent-os-ingress/transport.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress" / "transport.json").read_text()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"accepted={'true' if payload['status'] == 'accepted' else 'false'}\n")
              # #2940: notion-read envelopes are GitHub-hosted reads; they must
              # never trigger the GCP authentication / gcloud setup steps below.
              output.write(f"is_notion_read={'true' if payload['reason'] == 'accepted-notion-read-envelope' else 'false'}\n")
              output.write(f"is_discovery={'true' if payload['reason'] == 'accepted-discovery-envelope' else 'false'}\n")
              output.write(f"is_codespace_implementation={'true' if payload['reason'] == 'accepted-codespace-implementation-envelope' else 'false'}\n")
          PY

      - name: Evaluate fixed #3333 Codespaces operation admission
        if: ${{ steps.transport.outputs.is_codespace_implementation == 'true' }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src:08_Tooling/agent-os-execution-service/src:. \
            python -m scripts.agent_os_execution_interface.fixed_codespace_pilot \
              --transport "$RUNNER_TEMP/agent-os-ingress/transport.json" \
              --result-output "$RUNNER_TEMP/agent-os-ingress/result.json"

      # D1 (#3333): connect the fixed pilot to the trusted host. The four
      # steps below are the only new execution path. The provider-less
      # diagnostic above is unchanged and stays first: it can only report
      # needs-decision, never execution. Preflight, transfer, and run are
      # evidence steps that always exit 0 after recording a blocked
      # record; the acceptance gate below is the single terminal boundary
      # and the only new step that can fail the job. No step here uses
      # continue-on-error, and no step interpolates event or comment text
      # into any shell command: the event travels only as a copied file
      # plus a constructed --event path, and remote paths are built only
      # from validated numeric run/attempt values plus fixed literals.
      - name: Preflight fixed #3333 Codespaces connection
        id: fixed_preflight
        if: ${{ steps.transport.outputs.is_codespace_implementation == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_OS_CODESPACES_TOKEN }}
          AGENT_OS_CHECKPOINT_STORE_ROOT: ${{ vars.AGENT_OS_CHECKPOINT_STORE_ROOT }}
          AGENT_OS_REPOSITORY_ROOT: ${{ vars.AGENT_OS_REPOSITORY_ROOT }}
          AGENT_OS_WORKSPACE_PARENT: ${{ vars.AGENT_OS_WORKSPACE_PARENT }}
          AGENT_OS_LEASE_DIRECTORY: ${{ vars.AGENT_OS_LEASE_DIRECTORY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/agent-os-ingress"
          PYTHONPATH=08_Tooling/workflow-scheduler/src python - <<'PY'
          import json
          import os
          import re
          import shlex
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress"
          record_path = root / "gate2-transfer.json"
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          reasons: list[str] = []
          record: dict[str, object] = {"schema_version": "1.0"}
          try:
              from workflow_scheduler.governance.dev_validation_codespaces import (
                  resolve_current_codespace,
              )

              transport = json.loads((root / "transport.json").read_text(encoding="utf-8"))
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
              if re.fullmatch(r"[0-9]+", run_id) is None or re.fullmatch(r"[0-9]+", attempt) is None:
                  reasons.append("preflight-run-identity-invalid")
                  raise ValueError("run identity")
              record["run_id"] = int(run_id)
              record["attempt"] = int(attempt)
              record["remote_dir"] = f"/tmp/agent-os-gate2-{run_id}-{attempt}"
              if transport.get("repository") != os.environ.get("GITHUB_REPOSITORY"):
                  reasons.append("preflight-repository-mismatch")
              sha = transport.get("codespace_implementation_sha_or_none")
              if type(sha) is not str or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
                  reasons.append("preflight-sha-invalid")
                  raise ValueError("sha")
              bindings = {
                  name: os.environ.get(name, "")
                  for name in (
                      "AGENT_OS_CHECKPOINT_STORE_ROOT",
                      "AGENT_OS_REPOSITORY_ROOT",
                      "AGENT_OS_WORKSPACE_PARENT",
                      "AGENT_OS_LEASE_DIRECTORY",
                  )
              }
              bindings_present = all(
                  value.strip() != "" and os.path.isabs(value) for value in bindings.values()
              )
              record["bindings_present"] = bindings_present
              if not bindings_present:
                  reasons.append("preflight-bindings-invalid")
              # Fixed pilot measures and runs from this deterministic checkout.
              # Fail closed if the host binding names a different checkout.
              if bindings["AGENT_OS_REPOSITORY_ROOT"].rstrip("/") != "/workspaces/agent-os":
                  reasons.append("preflight-repository-root-mismatch")
              selection = resolve_current_codespace()
              selected = (
                  selection.codespace_name
                  if selection.selected is True
                  and selection.state == "Available"
                  and type(selection.codespace_name) is str
                  and selection.codespace_name
                  else None
              )
              record["selected"] = selected
              if selected is None:
                  reasons.append(f"preflight-selection-{selection.reason}")
              else:
                  main_head = subprocess.run(
                      [
                          "gh", "api",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/main",
                          "--jq", ".sha",
                      ],
                      capture_output=True, text=True, timeout=60,
                  )
                  main_matches = main_head.returncode == 0 and main_head.stdout.strip() == sha
                  record["main_head_matches"] = main_matches
                  if not main_matches:
                      reasons.append("preflight-main-head-mismatch")
                  remote_head = subprocess.run(
                      ["gh", "codespace", "ssh", "-c", selected, "--",
                       "git -C /workspaces/agent-os rev-parse HEAD"],
                      capture_output=True, text=True, timeout=120,
                  )
                  remote_matches = remote_head.returncode == 0 and remote_head.stdout.strip() == sha
                  record["remote_head_matches"] = remote_matches
                  if not remote_matches:
                      reasons.append("preflight-remote-head-mismatch")
                  identity = subprocess.run(
                      ["gh", "codespace", "ssh", "-c", selected, "--",
                       'printf %s "$CODESPACE_NAME"'],
                      capture_output=True, text=True, timeout=120,
                  )
                  identity_ok = identity.returncode == 0 and identity.stdout == selected
                  record["identity_present_equal"] = identity_ok
                  if not identity_ok:
                      reasons.append("preflight-identity-mismatch")
                  assignments = " ".join(
                      f"{name}={shlex.quote(value)}" for name, value in bindings.items()
                  )
                  pythonpath = (
                      "/workspaces/agent-os"
                      ":/workspaces/agent-os/08_Tooling/workflow-scheduler/src"
                      ":/workspaces/agent-os/08_Tooling/agent-os-execution-service/src"
                  )
                  remote_probe = (
                      "cd /workspaces/agent-os && "
                      f"{assignments} PYTHONPATH={shlex.quote(pythonpath)} "
                      "python3 -m agent_os_execution_service.gate2_production_controller "
                      "--check-bindings"
                  )
                  probe = subprocess.run(
                      ["gh", "codespace", "ssh", "-c", selected, "--", remote_probe],
                      capture_output=True, text=True, timeout=120,
                  )
                  probe_valid = False
                  try:
                      probe_payload = json.loads(probe.stdout)
                      probe_valid = (
                          probe.returncode == 0
                          and probe_payload.get("check_bindings") == "VALID"
                      )
                      if not probe_valid and type(probe_payload.get("reason")) is str:
                          reasons.append(f"preflight-probe-{probe_payload['reason']}")
                  except (json.JSONDecodeError, ValueError):
                      reasons.append("preflight-probe-unavailable")
                  record["probe"] = "VALID" if probe_valid else "INVALID"
                  if not probe_valid and "preflight-probe-unavailable" not in reasons:
                      reasons.append("preflight-probe-invalid")
          except Exception:
              if not reasons:
                  reasons.append("preflight-error")
          record["reason_codes"] = reasons
          record["ready"] = not reasons
          record_path.write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"ready={'true' if record['ready'] else 'false'}\n")
              output.write(f"selected={record.get('selected') or ''}\n")
              output.write(f"remote_dir={record.get('remote_dir') or ''}\n")
          PY

      - name: Transfer fixed #3333 event exclusively
        id: fixed_transfer
        if: ${{ steps.transport.outputs.is_codespace_implementation == 'true' && steps.fixed_preflight.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_OS_CODESPACES_TOKEN }}
        run: |
          umask 077
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress"
          record_path = root / "gate2-transfer.json"
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          record: dict[str, object] = {"schema_version": "1.0"}
          reason = ""
          try:
              record = json.loads(record_path.read_text(encoding="utf-8"))
              if record.get("ready") is not True:
                  reason = "transfer-preflight-not-ready"
                  raise ValueError(reason)
              selected = record.get("selected")
              remote_dir = record.get("remote_dir")
              if type(selected) is not str or not selected:
                  reason = "transfer-selection-missing"
                  raise ValueError(reason)
              if (
                  type(remote_dir) is not str
                  or re.fullmatch(r"/tmp/agent-os-gate2-[0-9]+-[0-9]+", remote_dir) is None
              ):
                  reason = "transfer-remote-dir-invalid"
                  raise ValueError(reason)
              private_dir = Path(os.environ["RUNNER_TEMP"]) / "agent-os-gate2-private"
              try:
                  private_dir.mkdir(mode=0o700, parents=False, exist_ok=False)
              except FileExistsError:
                  reason = "transfer-private-dir-exists"
                  raise
              event_src = Path(os.environ["GITHUB_EVENT_PATH"])
              raw = event_src.read_bytes()
              if len(raw) > 1_048_576:
                  reason = "transfer-event-oversize"
                  raise ValueError(reason)
              event_sha = hashlib.sha256(raw).hexdigest()
              staged_local = private_dir / "gate2-event.json"
              fd = os.open(str(staged_local), os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              try:
                  os.write(fd, raw)
              finally:
                  os.close(fd)
              # The remote directory is fresh per run: it must not already
              # exist, so a pre-existing directory (or event file) can
              # never be overwritten or silently reused.
              mkdir = subprocess.run(
                  ["gh", "codespace", "ssh", "-c", selected, "--",
                   f"mkdir -m 0700 '{remote_dir}'"],
                  capture_output=True, text=True, timeout=120,
              )
              if mkdir.returncode != 0:
                  reason = "transfer-remote-dir-exists"
                  raise ValueError(reason)
              cp = subprocess.run(
                  ["gh", "codespace", "cp", "-c", selected, str(staged_local),
                   f"remote:{remote_dir}/event.staging"],
                  capture_output=True, text=True, timeout=120,
              )
              if cp.returncode != 0:
                  reason = "transfer-copy-failed"
                  raise ValueError(reason)
              guard = subprocess.run(
                  ["gh", "codespace", "ssh", "-c", selected, "--",
                   f"test -f '{remote_dir}/event.staging' && test ! -L '{remote_dir}/event.staging' "
                   f"&& chmod 600 '{remote_dir}/event.staging' "
                   f"&& sha256sum '{remote_dir}/event.staging'"],
                  capture_output=True, text=True, timeout=120,
              )
              staging_sha = guard.stdout.split()[0] if guard.stdout.split() else ""
              if guard.returncode != 0:
                  reason = "transfer-staging-guard-failed"
                  raise ValueError(reason)
              if staging_sha != event_sha:
                  reason = "transfer-staging-sha-mismatch"
                  raise ValueError(reason)
              link = subprocess.run(
                  ["gh", "codespace", "ssh", "-c", selected, "--",
                   f"ln '{remote_dir}/event.staging' '{remote_dir}/event.json'"],
                  capture_output=True, text=True, timeout=120,
              )
              if link.returncode != 0:
                  reason = "transfer-link-failed"
                  raise ValueError(reason)
              verify = subprocess.run(
                  ["gh", "codespace", "ssh", "-c", selected, "--",
                   f"test -f '{remote_dir}/event.json' && test ! -L '{remote_dir}/event.json' "
                   f"&& sha256sum '{remote_dir}/event.json' "
                   f"&& stat -c %i '{remote_dir}/event.staging' "
                   f"&& stat -c %i '{remote_dir}/event.json'"],
                  capture_output=True, text=True, timeout=120,
              )
              # sha256sum prints "<hash>  <path>"; the two stat lines are
              # the staging and final inode numbers, which must be equal
              # (the link did not substitute content).
              lines = verify.stdout.strip().splitlines()
              if (
                  verify.returncode != 0
                  or len(lines) != 3
                  or lines[0].split()[0] != event_sha
                  or lines[1].strip() != lines[2].strip()
              ):
                  reason = "transfer-final-verification-failed"
                  raise ValueError(reason)
              record["transfer_ok"] = True
              record["event_sha256"] = event_sha
              record["event_bytes"] = len(raw)
              record["staging_sha256"] = staging_sha
              record["final_sha256"] = lines[0].split()[0]
              record["inode_equal"] = True
              record["reason_codes"] = []
          except Exception:
              if not reason:
                  reason = "transfer-error"
              record["transfer_ok"] = False
              record["reason_codes"] = [reason]
          record_path.write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"transfer_ok={'true' if record.get('transfer_ok') is True else 'false'}\n")
          PY

      - name: Run Gate 2 fixed #3333 pilot and return receipt
        id: fixed_run
        if: ${{ steps.transport.outputs.is_codespace_implementation == 'true' && steps.fixed_transfer.outputs.transfer_ok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_OS_CODESPACES_TOKEN }}
          AGENT_OS_CHECKPOINT_STORE_ROOT: ${{ vars.AGENT_OS_CHECKPOINT_STORE_ROOT }}
          AGENT_OS_REPOSITORY_ROOT: ${{ vars.AGENT_OS_REPOSITORY_ROOT }}
          AGENT_OS_WORKSPACE_PARENT: ${{ vars.AGENT_OS_WORKSPACE_PARENT }}
          AGENT_OS_LEASE_DIRECTORY: ${{ vars.AGENT_OS_LEASE_DIRECTORY }}
        run: |
          umask 077
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shlex
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress"
          record_path = root / "gate2-transfer.json"
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          record: dict[str, object] = {"schema_version": "1.0"}
          stdout_path = root / "gate2-stdout.json"
          stderr_path = root / "gate2-stderr.json"
          try:
              record = json.loads(record_path.read_text(encoding="utf-8"))
              transport = json.loads((root / "transport.json").read_text(encoding="utf-8"))
              if record.get("transfer_ok") is not True:
                  raise ValueError("run-transfer-not-ok")
              selected = record.get("selected")
              remote_dir = record.get("remote_dir")
              if type(selected) is not str or not selected:
                  raise ValueError("run-selection-missing")
              if (
                  type(remote_dir) is not str
                  or re.fullmatch(r"/tmp/agent-os-gate2-[0-9]+-[0-9]+", remote_dir) is None
              ):
                  raise ValueError("run-remote-dir-invalid")
              bindings = {
                  name: os.environ.get(name, "")
                  for name in (
                      "AGENT_OS_CHECKPOINT_STORE_ROOT",
                      "AGENT_OS_REPOSITORY_ROOT",
                      "AGENT_OS_WORKSPACE_PARENT",
                      "AGENT_OS_LEASE_DIRECTORY",
                  )
              }
              assignments = " ".join(
                  f"{name}={shlex.quote(value)}" for name, value in bindings.items()
              )
              pythonpath = (
                  "/workspaces/agent-os"
                  ":/workspaces/agent-os/08_Tooling/workflow-scheduler/src"
                  ":/workspaces/agent-os/08_Tooling/agent-os-execution-service/src"
              )
              remote_command = (
                  "cd /workspaces/agent-os && "
                  f"{assignments} PYTHONPATH={shlex.quote(pythonpath)} "
                  "python3 -m agent_os_execution_service.gate2_production_controller "
                  f"--event '{remote_dir}/event.json'"
              )
              with stdout_path.open("wb") as stdout_file, stderr_path.open("wb") as stderr_file:
                  try:
                      completed = subprocess.run(
                          ["gh", "codespace", "ssh", "-c", selected, "--", remote_command],
                          stdout=stdout_file, stderr=stderr_file, timeout=300,
                      )
                      run_rc = completed.returncode
                  except subprocess.TimeoutExpired:
                      run_rc = 124
              record["run_rc"] = run_rc
              record["receipt_returned"] = False
              if run_rc == 0:
                  reference = json.loads(stdout_path.read_text(encoding="utf-8"))
                  receipt_path = reference.get("receipt_path")
                  store_root = Path(bindings["AGENT_OS_CHECKPOINT_STORE_ROOT"])
                  receipt_file = Path(receipt_path) if type(receipt_path) is str else None
                  receipts_dir = store_root / "invocations" / "receipts"
                  # Lexical remote validation, not runner-local resolution.
                  # Path() normalizes a trailing root slash; exact canonical
                  # parent and spelling checks prohibit traversal/aliases.
                  receipt_path_canonical = (
                      store_root.is_absolute()
                      and ".." not in store_root.parts
                      and receipt_file is not None
                      and receipt_file.is_absolute()
                      and ".." not in receipt_file.parts
                      and str(receipt_file) == receipt_path
                      and receipt_file.parent == receipts_dir
                  )
                  if (
                      type(reference) is not dict
                      or set(reference.keys()) != {
                          "schema_version", "operation_id", "repository",
                          "issue_number", "receipt_path", "handoff_id",
                          "expected_sha", "status", "reason_codes", "consumer",
                      }
                      or type(receipt_path) is not str
                      or not receipt_path_canonical
                      or re.fullmatch(
                          r"fixed-head-probe-[0-9a-f]{64}-[0-9a-f]{40}-\d{8}T\d{6}Z\.json",
                          receipt_file.name if receipt_file is not None else "",
                      ) is None
                      or reference.get("handoff_id")
                      != transport.get("codespace_implementation_handoff_id_or_none")
                      or reference.get("expected_sha")
                      != transport.get("codespace_implementation_sha_or_none")
                  ):
                      raise ValueError("run-reference-invalid")
                  target = root / "gate2-receipt.json"
                  staging = root / "gate2-receipt.json.staging"
                  if target.exists() or target.is_symlink():
                      raise ValueError("run-receipt-target-exists")
                  cp = subprocess.run(
                      ["gh", "codespace", "cp", "-c", selected,
                       f"remote:{receipt_path}", str(staging)],
                      capture_output=True, text=True, timeout=120,
                  )
                  if cp.returncode != 0 or not staging.is_file() or staging.is_symlink():
                      raise ValueError("run-receipt-copy-failed")
                  os.chmod(staging, 0o600)
                  try:
                      os.link(staging, target)
                  except FileExistsError:
                      raise ValueError("run-receipt-link-failed") from None
                  record["receipt_returned"] = True
                  record["receipt_path"] = receipt_path
                  record["receipt_sha256"] = hashlib.sha256(staging.read_bytes()).hexdigest()
              else:
                  try:
                      stderr_payload = json.loads(stderr_path.read_text(encoding="utf-8"))
                      reasons = stderr_payload.get("reason_codes")
                      record["run_reason"] = (
                          reasons
                          if type(reasons) is list and reasons
                          else ["gate2-stderr-unparseable"]
                      )
                  except (OSError, json.JSONDecodeError, ValueError):
                      record["run_reason"] = ["gate2-stderr-unparseable"]
          except Exception as exc:
              record["run_rc"] = record.get("run_rc") if type(record.get("run_rc")) is int else -1
              record["receipt_returned"] = False
              record["run_reason"] = [f"run-error-{type(exc).__name__}"]
          record_path.write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Enforce fixed #3333 pilot acceptance gate
        id: fixed_gate
        if: ${{ always() && steps.transport.outputs.is_codespace_implementation == 'true' }}
        run: |
          set -u
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.dev_validation_gate --fixed-pilot \
              --transport "$RUNNER_TEMP/agent-os-ingress/transport.json" \
              --result "$RUNNER_TEMP/agent-os-ingress/result.json" \
              --reference "$RUNNER_TEMP/agent-os-ingress/gate2-stdout.json" \
              --process-stderr "$RUNNER_TEMP/agent-os-ingress/gate2-stderr.json" \
              --receipt "$RUNNER_TEMP/agent-os-ingress/gate2-receipt.json" \
              --transfer "$RUNNER_TEMP/agent-os-ingress/gate2-transfer.json" \
              --event-private "$RUNNER_TEMP/agent-os-gate2-private/gate2-event.json" \
              --output "$RUNNER_TEMP/agent-os-ingress/gate2-gate.json"
          gate_rc=$?
          decision="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          gate = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress" / "gate2-gate.json"
          try:
              print("pass" if json.loads(gate.read_text(encoding="utf-8")).get("decision") == "PASS" else "fail")
          except Exception:
              print("fail")
          PY
          )"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$gate_rc" -ne 0 ]; then
            exit "$gate_rc"
          fi
          if [ "$decision" != "pass" ]; then
            exit 1
          fi

      - name: Resolve Codespaces-first transport route
        id: route
        if: ${{ steps.transport.outputs.is_codespace_implementation != 'true' && steps.transport.outputs.accepted == 'true' }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.codespaces_first_route \
              --transport "$RUNNER_TEMP/agent-os-ingress/transport.json" \
              --route-output "$RUNNER_TEMP/agent-os-ingress/route.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress"
          route = json.loads((root / "route.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"preferred={route['preferred']}\n")
              output.write(f"gce_fallback_allowed={'true' if route['gce_fallback_allowed'] else 'false'}\n")
          if route["preferred"] == "none":
              result = {
                  "schema_version": "1.0",
                  "dispatch_status": "blocked",
                  "dispatch_reason": ",".join(route["reason_codes"]),
                  "execution_authorized": False,
                  "scheduler_invoked": False,
                  "side_effects_performed": False,
              }
              (root / "result.json").write_text(
                  json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Record non-accepted bounded transport evidence
        if: ${{ steps.transport.outputs.is_codespace_implementation != 'true' && steps.transport.outputs.accepted != 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress"
          transport = json.loads((root / "transport.json").read_text(encoding="utf-8"))
          result = {
              "schema_version": "1.0",
              "transport": transport,
              "dispatch_status": "blocked",
              "dispatch_reason": transport["reason"],
              "execution_authorized": False,
              "scheduler_invoked": False,
              "side_effects_performed": False,
          }
          (root / "result.json").write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Attempt bounded read-only Codespaces diagnostic
        id: codespaces_diagnostic
        if: ${{ steps.transport.outputs.is_codespace_implementation != 'true' && steps.transport.outputs.accepted == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_OS_CODESPACES_TOKEN }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.codespaces_diagnostic \
              --transport "$RUNNER_TEMP/agent-os-ingress/transport.json" \
              --route-output "$RUNNER_TEMP/agent-os-ingress/codespaces-diagnostic-route.json" \
              --result-output "$RUNNER_TEMP/agent-os-ingress/result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          route = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress" / "codespaces-diagnostic-route.json").read_text()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"handled={'true' if route.get('handled') is True else 'false'}\n")
              output.write(f"selected={'true' if route.get('selected') is True else 'false'}\n")
          PY

      - name: Attempt read-only Codespaces developer validation
        id: codespaces
        if: ${{ steps.transport.outputs.is_codespace_implementation != 'true' && steps.transport.outputs.accepted == 'true' && steps.codespaces_diagnostic.outputs.handled != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_OS_CODESPACES_TOKEN }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.dev_validation_codespaces \
              --transport "$RUNNER_TEMP/agent-os-ingress/transport.json" \
              --route-output "$RUNNER_TEMP/agent-os-ingress/codespaces-route.json" \
              --result-output "$RUNNER_TEMP/agent-os-ingress/result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          route = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress" / "codespaces-route.json").read_text()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"selected={'true' if route.get('selected') is True else 'false'}\n")
          PY

      - name: Attempt Codespaces discovery
        id: codespaces_discovery
        if: ${{ steps.transport.outputs.is_discovery == 'true' && steps.transport.outputs.is_codespace_implementation != 'true' && steps.transport.outputs.accepted == 'true' && steps.codespaces_diagnostic.outputs.handled != 'true' && steps.codespaces.outputs.selected != 'true' && steps.route.outputs.preferred == 'codespaces' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_OS_CODESPACES_TOKEN }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.discovery_codespaces \
              --transport "$RUNNER_TEMP/agent-os-ingress/transport.json" \
              --route-output "$RUNNER_TEMP/agent-os-ingress/codespaces-discovery-route.json" \
              --result-output "$RUNNER_TEMP/agent-os-ingress/result.json"
          # Keep the independent discovery receipt for existing evidence consumers.
          # Ordinary requests cannot enter the GCE transport.
          cp "$RUNNER_TEMP/agent-os-ingress/result.json" \
             "$RUNNER_TEMP/agent-os-ingress/codespaces-discovery-result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress"
          route = json.loads((root / "codespaces-discovery-route.json").read_text())
          result_path = root / "result.json"
          capable = False
          if result_path.exists():
              result = json.loads(result_path.read_text(encoding="utf-8"))
              capable = result.get("codespaces_capable") is True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"selected={'true' if route.get('selected') is True else 'false'}\n")
              output.write(f"capable={'true' if capable else 'false'}\n")
          PY

      - name: Authenticate bounded Agent OS transport
        if: ${{ steps.transport.outputs.accepted == 'true' && steps.transport.outputs.is_notion_read != 'true' && steps.codespaces_diagnostic.outputs.handled != 'true' && steps.codespaces.outputs.selected != 'true' && (steps.codespaces_discovery.outputs.selected != 'true' || steps.codespaces_discovery.outputs.capable != 'true') && steps.route.outputs.preferred == 'gce' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/966859826758/locations/global/workloadIdentityPools/agent-os-github/providers/agent-os-main
          service_account: agent-os-transport@agent-os-502614.iam.gserviceaccount.com

      - name: Install Google Cloud CLI
        if: ${{ steps.transport.outputs.accepted == 'true' && steps.transport.outputs.is_notion_read != 'true' && steps.codespaces_diagnostic.outputs.handled != 'true' && steps.codespaces.outputs.selected != 'true' && (steps.codespaces_discovery.outputs.selected != 'true' || steps.codespaces_discovery.outputs.capable != 'true') && steps.route.outputs.preferred == 'gce' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Invoke exact governed GCE control path
        if: ${{ steps.transport.outputs.is_codespace_implementation != 'true' && steps.transport.outputs.accepted == 'true' && steps.codespaces_diagnostic.outputs.handled != 'true' && steps.codespaces.outputs.selected != 'true' && (steps.codespaces_discovery.outputs.selected != 'true' || steps.codespaces_discovery.outputs.capable != 'true') && steps.route.outputs.preferred == 'gce' }}
        env:
          AGENT_OS_WIF_AUDIENCE: //iam.googleapis.com/projects/966859826758/locations/global/workloadIdentityPools/agent-os-github/providers/agent-os-main
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.gce_gcloud_adapter \
              --transport "$RUNNER_TEMP/agent-os-ingress/transport.json" \
              --output "$RUNNER_TEMP/agent-os-ingress/result.json" \
              --repository "$GITHUB_REPOSITORY" \
              --repository-owner "${{ github.repository_owner }}" \
              --workflow-ref "${{ github.workflow_ref }}" \
              --ref "$GITHUB_REF" \
              --audience "$AGENT_OS_WIF_AUDIENCE"

      - name: Publish bounded invocation summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress"
          transport_path = root / "transport.json"
          result_path = root / "result.json"
          codespaces_route_path = root / "codespaces-route.json"
          diagnostic_route_path = root / "codespaces-diagnostic-route.json"
          route_path = root / "route.json"
          discovery_route_path = root / "codespaces-discovery-route.json"
          discovery_result_path = root / "codespaces-discovery-result.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Agent OS governed invocation\n\n")
              if route_path.exists():
                  ingress_route = json.loads(route_path.read_text(encoding="utf-8"))
                  summary.write(f"Transport route preferred: `{ingress_route.get('preferred')}`\n\n")
                  summary.write(f"Route reasons: `{','.join(ingress_route.get('reason_codes', []))}`\n\n")
                  summary.write(f"GCE fallback allowed: `{ingress_route.get('gce_fallback_allowed')}`\n\n")
              if discovery_route_path.exists():
                  discovery_route = json.loads(discovery_route_path.read_text(encoding="utf-8"))
                  summary.write(f"Codespaces discovery selected: `{discovery_route.get('selected')}`\n\n")
                  summary.write(f"Codespaces discovery reasons: `{','.join(discovery_route.get('reason_codes', []))}`\n\n")
              result_capable_path = root / "result.json"
              if result_capable_path.exists():
                  try:
                      capable_result = json.loads(result_capable_path.read_text(encoding="utf-8"))
                      if "codespaces_capable" in capable_result:
                          summary.write(f"Codespaces discovery capable: `{capable_result.get('codespaces_capable')}`\n\n")
                  except json.JSONDecodeError:
                      pass
              # Surface the independent discovery receipt and SSH diagnostics.
              if discovery_result_path.exists():
                  try:
                      preserved = json.loads(discovery_result_path.read_text(encoding="utf-8"))
                      preserved_discovery = preserved.get("discovery")
                      summary.write(f"Codespaces discovery payload preserved: `True`\n\n")
                      summary.write(f"Preserved capable: `{preserved.get('codespaces_capable')}`\n\n")
                      if isinstance(preserved_discovery, dict):
                          summary.write(f"Preserved discovery status: `{preserved_discovery.get('status')}`\n\n")
                          summary.write(f"Preserved discovery reasons: `{','.join(preserved_discovery.get('reason_codes', []))}`\n\n")
                  except json.JSONDecodeError:
                      summary.write("Codespaces discovery payload preserved: `True`\n\n")
                      summary.write("Preserved payload: `unparseable`\n\n")
              if diagnostic_route_path.exists():
                  diagnostic_route = json.loads(diagnostic_route_path.read_text(encoding="utf-8"))
                  summary.write(f"Codespaces diagnostic handled: `{diagnostic_route.get('handled')}`\n\n")
                  summary.write(f"Codespaces diagnostic selected: `{diagnostic_route.get('selected')}`\n\n")
                  summary.write(f"Codespaces diagnostic reasons: `{','.join(diagnostic_route.get('reason_codes', []))}`\n\n")
              if codespaces_route_path.exists():
                  route = json.loads(codespaces_route_path.read_text(encoding="utf-8"))
                  summary.write(f"Codespaces selected: `{route.get('selected')}`\n\n")
                  summary.write(f"Codespaces reasons: `{','.join(route.get('reason_codes', []))}`\n\n")
                  summary.write(f"Codespaces surface: `{route.get('execution_surface_id')}`\n\n")
              if transport_path.exists():
                  transport = json.loads(transport_path.read_text(encoding="utf-8"))
                  summary.write(f"Transport: `{transport['status']}` / `{transport['reason']}`\n\n")
              if result_path.exists():
                  result = json.loads(result_path.read_text(encoding="utf-8"))
                  control = result.get("control")
                  if isinstance(control, dict):
                      summary.write(f"Control status: `{control.get('status')}`\n\n")
                      summary.write(f"Reasons: `{','.join(control.get('reason_codes', []))}`\n\n")
                      summary.write(f"Scheduler accepted: `{control.get('host_accepted')}`\n\n")
                      summary.write(f"Automatic shutdown issued: `{control.get('shutdown_issued')}`\n")
                  # D1 (#3333): the fixed envelope takes precedence over the
                  # generic Dispatch fallback below. The provider-less
                  # diagnostic is never presented as execution, and the
                  # acceptance gate decision is shown whenever it exists.
                  # (Rebased onto current main: main replaced the old
                  # `maintenance` summary block with the `control` block
                  # above; only the D1 block is carried forward here.)
                  codespace_impl = result.get("codespace_implementation")
                  if isinstance(codespace_impl, dict):
                      summary.write(f"Fixed Codespaces diagnostic: `{codespace_impl.get('status')}`\n\n")
                      summary.write(f"Fixed diagnostic reasons: `{','.join(codespace_impl.get('reason_codes', []))}`\n\n")
                      gate_path = root / "gate2-gate.json"
                      if gate_path.exists():
                          try:
                              gate = json.loads(gate_path.read_text(encoding="utf-8"))
                              summary.write(f"Fixed pilot acceptance gate: `{gate.get('decision')}`\n\n")
                              summary.write(f"Fixed gate reasons: `{','.join(gate.get('reason_codes', []))}`\n\n")
                          except json.JSONDecodeError:
                              summary.write("Fixed pilot acceptance gate: `unparseable`\n\n")
                      else:
                          summary.write("Fixed pilot acceptance gate: `unavailable`\n\n")
                      summary.write("Provider-less diagnostic only; not execution evidence.\n")
                  # Main's `control` if/else cannot span the D1 block
                  # above, so the else-branch is spelled as its negation:
                  # identical semantics to current main (chain runs only
                  # when no `control` dict is present).
                  if not isinstance(control, dict):
                      discovery = result.get("discovery")
                      if isinstance(discovery, dict):
                          summary.write(f"Discovery status: `{discovery.get('status')}`\n\n")
                          summary.write(f"Reasons: `{','.join(discovery.get('reason_codes', []))}`\n\n")
                          summary.write(f"Handoff found: `{discovery.get('handoff_id') is not None}`\n\n")
                          summary.write("Scheduler invoked by discovery: `False`\n")
                      else:
                          diagnostic = result.get("diagnostic")
                          if isinstance(diagnostic, dict):
                              summary.write(f"Diagnostic status: `{diagnostic.get('status')}`\n\n")
                              summary.write(f"Diagnostic reasons: `{','.join(diagnostic.get('reason_codes', []))}`\n\n")
                              summary.write(f"Diagnostic identity: `{diagnostic.get('diagnostic_id')}`\n\n")
                              summary.write(f"Diagnostic request: `{diagnostic.get('request_id')}`\n\n")
                              summary.write(f"Diagnostic cleanup complete: `{diagnostic.get('cleanup_complete')}`\n")
                          else:
                              dev_validation = result.get("dev_validation")
                              if isinstance(dev_validation, dict):
                                  summary.write(f"Developer validation: `{dev_validation.get('status')}`\n\n")
                                  summary.write(f"Reasons: `{','.join(dev_validation.get('reason_codes', []))}`\n\n")
                                  summary.write(f"Tested SHA: `{dev_validation.get('tested_sha')}`\n\n")
                                  summary.write(f"Validation identity: `{dev_validation.get('validation_id')}`\n\n")
                                  summary.write(f"Exit code: `{dev_validation.get('exit_code')}`\n\n")
                                  summary.write(f"Cleanup complete: `{dev_validation.get('cleanup_complete')}`\n")
                              else:
                                  # D1: never show the generic Dispatch
                                  # fallback line when a fixed envelope is
                                  # present; the fixed diagnostic above is
                                  # the authoritative summary for it.
                                  if not isinstance(result.get("codespace_implementation"), dict):
                                      summary.write(f"Dispatch: `{result.get('dispatch_status')}` / `{result.get('dispatch_reason')}`\n")
              else:
                  summary.write("Result evidence unavailable; manual review required.\n")
          PY

      # D1 (#3333): remove the private remote staging directory only after
      # the acceptance gate passed. On gate FAIL the remote directory is
      # left in place for diagnosis (it is 0700, namespaced, and never
      # uploaded). This step never touches the host receipt, any claim,
      # or any artifact file, and never fails the job: its outcome is
      # recorded in gate2-cleanup.json, which the upload step publishes.
      - name: Clean up fixed #3333 remote staging on gate pass
        id: fixed_cleanup
        if: ${{ steps.fixed_gate.outputs.decision == 'pass' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_OS_CODESPACES_TOKEN }}
        run: |
          umask 077
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ingress"
          cleanup_path = root / "gate2-cleanup.json"
          outcome: dict[str, object] = {"schema_version": "1.0", "cleanup": "failed"}
          try:
              record = json.loads((root / "gate2-transfer.json").read_text(encoding="utf-8"))
              selected = record.get("selected")
              remote_dir = record.get("remote_dir")
              if type(selected) is not str or not selected:
                  raise ValueError("cleanup-selection-missing")
              if (
                  type(remote_dir) is not str
                  or re.fullmatch(r"/tmp/agent-os-gate2-[0-9]+-[0-9]+", remote_dir) is None
              ):
                  raise ValueError("cleanup-remote-dir-invalid")
              removed = subprocess.run(
                  ["gh", "codespace", "ssh", "-c", selected, "--", f"rm -rf '{remote_dir}'"],
                  capture_output=True, text=True, timeout=120,
              )
              if removed.returncode != 0:
                  raise ValueError("cleanup-remote-removal-failed")
              shutil.rmtree(
                  Path(os.environ["RUNNER_TEMP"]) / "agent-os-gate2-private",
                  ignore_errors=True,
              )
              outcome = {"schema_version": "1.0", "cleanup": "done"}
          except Exception as exc:
              outcome["reason"] = f"cleanup-error-{type(exc).__name__}"
          cleanup_path.write_text(json.dumps(outcome, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Enforce developer-validation result gate
        if: ${{ always() }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.dev_validation_gate \
              --transport "$RUNNER_TEMP/agent-os-ingress/transport.json" \
              --result "$RUNNER_TEMP/agent-os-ingress/result.json"

      - name: Publish bounded ingress evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-ingress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-os-ingress/*.json
          if-no-files-found: warn
          retention-days: 7

  refresh_pr:
    name: Run finite governed PR refresh
    # Coarse cost prefilter only; it is deliberately a superset of the canonical
    # grammar and carries no operand semantics. Operation grammar is owned solely
    # by scripts/agent_os_issue_labels/pr_branch_refresh_actions.py, which emits
    # the precise rejected-trigger reason as bounded terminal evidence. Do not
    # reintroduce operand parsing here (#1875).
    if: ${{ github.event.issue.pull_request == null && github.event.comment.user.id == 32861845 && startsWith(github.event.comment.body, '/agent-os refresh-pr') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out canonical workflow source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # #3294: the fixed post-refresh validation profile (pr_branch_refresh_operator)
      # runs `python -m pytest` and imports yaml via the issue-acceptance package, so
      # the interpreter needs exactly these exact-pinned distributions and nothing
      # from the floating requirements-dev.txt set.
      - name: Install bounded refresh runtime dependencies
        run: python -m pip install PyGithub==2.10.0 pytest==9.1.1 PyYAML==6.0.3

      - name: Run finite governed PR refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/agent-os-refresh"
          python -m scripts.agent_os_issue_labels.pr_branch_refresh_actions_runner \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository-root "$GITHUB_WORKSPACE" \
            --invocation-id "actions:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/agent-os-refresh/result.json"

      - name: Publish bounded refresh summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          SHA40 = re.compile(r"^[0-9a-f]{40}$")

          def codes(value):
              if not isinstance(value, (list, tuple)):
                  return ""
              return ",".join(item for item in value if isinstance(item, str) and item)

          path = Path(os.environ["RUNNER_TEMP"]) / "agent-os-refresh" / "result.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Agent OS governed PR refresh\n\n")
              if not path.exists():
                  summary.write("Result evidence unavailable; manual review required.\n")
              else:
                  result = json.loads(path.read_text(encoding="utf-8"))
                  summary.write(f"Status: `{result.get('status')}`\n\n")
                  summary.write(f"Reasons: `{codes(result.get('reason_codes'))}`\n\n")
                  summary.write(f"Mutation count: `{result.get('mutation_count')}`\n\n")
                  summary.write(f"Authorization receipt published: `{result.get('authorization_receipt_published')}`\n\n")
                  http_status = result.get("receipt_publication_http_status")
                  if isinstance(http_status, int):
                      summary.write(f"Receipt publication HTTP status: `{http_status}`\n\n")
                  receipt = result.get("refresh_receipt")
                  if isinstance(receipt, dict):
                      summary.write(f"Underlying refresh status: `{receipt.get('status')}`\n\n")
                      summary.write(f"Underlying refresh reasons: `{codes(receipt.get('reason_codes'))}`\n\n")
                      new_head = receipt.get("new_head_sha")
                      if isinstance(new_head, str) and SHA40.fullmatch(new_head):
                          summary.write(f"Refreshed head SHA: `{new_head}`\n")
                  else:
                      summary.write("Underlying refresh receipt: `unavailable`\n")
          PY

      - name: Publish bounded refresh evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-os-refresh/result.json
          if-no-files-found: warn
          retention-days: 7

  ready_admission:
    name: Run finite Ready-for-Review admission
    # Coarse prefilter only; the exact fixed grammar is owned solely by
    # workflow_scheduler.governance.github_issue_comment_ingress (#3446). The
    # job is read-only: it evaluates admission and publishes a non-authorizing
    # receipt. It never marks a PR Ready; the host does that after verifying
    # the receipt against a fresh PR readback.
    if: ${{ github.event.issue.pull_request == null && github.event.comment.user.id == 32861845 && startsWith(github.event.comment.body, '/agent-os ready-admit ') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Check out canonical workflow source
        uses: actions/checkout@v7

      - name: Install bounded admission runtime dependencies
        run: python -m pip install PyGithub==2.10.0 PyYAML==6.0.3

      - name: Parse low-trust issue comment envelope
        run: |
          mkdir -p "$RUNNER_TEMP/agent-os-ready"
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.github_issue_comment_ingress \
              --event "$GITHUB_EVENT_PATH" \
              --repository "$GITHUB_REPOSITORY" \
              --allowed-actor Blummer92 \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$RUNNER_TEMP/agent-os-ready/transport.json"

      - name: Evaluate fixed Ready-for-Review admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.agent_os_issue_labels.ready_admission_actions \
            --transport "$RUNNER_TEMP/agent-os-ready/transport.json" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/agent-os-ready/receipt.json"

      - name: Publish bounded admission summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "agent-os-ready" / "receipt.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Agent OS Ready-for-Review admission\n\n")
              if not path.exists():
                  summary.write("Receipt unavailable; manual review required.\n")
              else:
                  receipt = json.loads(path.read_text(encoding="utf-8"))
                  summary.write(f"Admissible: `{receipt.get('transition_admissible')}`\n\n")
                  summary.write(f"Provisional Ready: `{receipt.get('provisional_ready')}`\n\n")
                  summary.write(f"Reasons: `{','.join(receipt.get('reason_codes', []))}`\n\n")
                  summary.write(f"Receipt: `{receipt.get('receipt_id')}`\n")
          PY

      - name: Publish bounded admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-ready-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-os-ready/*.json
          if-no-files-found: warn
          retention-days: 7

  merge_admission:
    name: Run finite read-only merge-admission evidence acquisition
    # #3463: This operation carries only immutable selectors.
    # No merge, authorization creation, or GitHub write is granted.
    if: ${{ github.event.issue.pull_request == null && github.event.comment.user.id == 32861845 && startsWith(github.event.comment.body, '/agent-os merge-admit ') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Check out canonical workflow source
        uses: actions/checkout@v7

      - name: Install bounded runtime dependencies
        run: python -m pip install PyGithub==2.10.0 PyYAML==6.0.3

      - name: Parse fixed merge-admission trigger
        run: |
          mkdir -p "$RUNNER_TEMP/agent-os-merge-admission"
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.github_issue_comment_ingress \
              --event "$GITHUB_EVENT_PATH" \
              --repository "$GITHUB_REPOSITORY" \
              --allowed-actor Blummer92 \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$RUNNER_TEMP/agent-os-merge-admission/transport.json"

      # Single read-only evaluation includes canonical admission and
      # dispatch-time re-verification. This job does not execute a merge.
      # A future merge host must independently verify currentness.

      - name: Evaluate dispatch-time merge applicability (read-only, no merge)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.agent_os_issue_acceptance.merge_applicability \
            --transport "$RUNNER_TEMP/agent-os-merge-admission/transport.json" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/agent-os-merge-admission/dispatch_receipt.json"

      - name: Publish merge-admission evidence summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"]) / "agent-os-merge-admission"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Merge-admission evidence (#3463)\n\n")
              summary.write("This job performs no merge and no GitHub mutation. A dispatch receipt is admission only.\n\n")
              dispatch = base / "dispatch_receipt.json"
              if not dispatch.exists():
                  summary.write("Dispatch evidence missing; fail closed.\n")
              else:
                  result = json.loads(dispatch.read_text(encoding="utf-8"))
                  candidate = result.get("admission_receipt") if isinstance(result, dict) else None
                  if not isinstance(candidate, dict):
                      summary.write("Candidate evidence missing; fail closed.\n\n")
                  else:
                      summary.write(f"Candidate status: {candidate.get('status')}\n\n")
                      summary.write(f"Candidate reasons: {','.join(candidate.get('reason_codes', []))}\n\n")
                      summary.write(f"Source: {candidate.get('authorization_source_status')}\n\n")
                      summary.write("Candidate merge authorized: False\n\n")
                  summary.write(f"Dispatch status: {result.get('status')}\n\n")
                  summary.write(f"Dispatch merge authorized: {result.get('merge_authorized')}\n\n")
                  summary.write(f"Dispatch reasons: {','.join(result.get('reason_codes', []))}\n\n")
                  summary.write(f"Canonical applicability evaluated: {result.get('canonical_applicability_evaluated')}\n")
          PY

      - name: Publish bounded merge-admission receipt artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-merge-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-os-merge-admission/*.json
          if-no-files-found: warn
          retention-days: 7

  draft_validation_dispatch:
    name: Dispatch bounded Draft final-candidate validation
    # #2410: fixed operation only. The grammar, target workflow identity, and
    # admission are owned by workflow_scheduler.governance modules running
    # from the canonical default-branch source. This job is the sole holder
    # of Actions write authority in this workflow; its token is confined to this job.
    # It dispatches the existing validation workflow for one open Draft PR at
    # its exact head. It never marks a PR Ready, merges, or closes an issue.
    # The GitHub Service Agent app identity (chatgpt-codex-connector[bot],
    # user id 199175422) is admitted for this validate-draft operation only:
    # the ingress parser enforces that scope in-job; every other operation in
    # this workflow remains owner-only.
    if: ${{ github.event.issue.pull_request == null && github.ref == 'refs/heads/main' && (github.event.comment.user.id == 32861845 || github.event.comment.user.id == 199175422) && startsWith(github.event.comment.body, '/agent-os validate-draft ') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.dispatch.outputs.decision }}
      run_id: ${{ steps.dispatch.outputs.run_id }}
      trigger_id: ${{ steps.dispatch.outputs.trigger_id }}
      reason_codes: ${{ steps.dispatch.outputs.reason_codes }}
      observed_head_sha: ${{ steps.dispatch.outputs.observed_head_sha }}
      run_status: ${{ steps.dispatch.outputs.run_status }}
      run_conclusion: ${{ steps.dispatch.outputs.run_conclusion }}
    steps:
      - name: Check out canonical workflow source
        uses: actions/checkout@v7
        with:
          # No later step runs git against the remote; do not leave the job
          # token in .git/config where an installed dependency could read it.
          persist-credentials: false

      - name: Install bounded dispatch runtime dependencies
        run: python -m pip install PyGithub==2.10.0 PyYAML==6.0.3

      - name: Parse low-trust issue comment envelope
        run: |
          mkdir -p "$RUNNER_TEMP/agent-os-draft-validation"
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.github_issue_comment_ingress \
              --event "$GITHUB_EVENT_PATH" \
              --repository "$GITHUB_REPOSITORY" \
              --allowed-actor Blummer92 \
              --draft-validation-service-actor 'chatgpt-codex-connector[bot]' \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$RUNNER_TEMP/agent-os-draft-validation/transport.json"

      - name: Verify, deduplicate, dispatch, and correlate
        id: dispatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.draft_validation_dispatch \
              --mode dispatch \
              --transport "$RUNNER_TEMP/agent-os-draft-validation/transport.json" \
              --repository "$GITHUB_REPOSITORY" \
              --output "$RUNNER_TEMP/agent-os-draft-validation/receipt.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "agent-os-draft-validation" / "receipt.json").read_text()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"decision={receipt.get('decision')}\n")
              output.write(f"run_id={receipt.get('run_id_or_none') or ''}\n")
              output.write(f"trigger_id={receipt.get('trigger_id') or ''}\n")
              output.write(f"reason_codes={','.join(receipt.get('reason_codes') or [])}\n")
              output.write(f"observed_head_sha={receipt.get('observed_head_sha') or ''}\n")
              output.write(f"run_status={receipt.get('run_status_or_none') or ''}\n")
              output.write(f"run_conclusion={receipt.get('run_conclusion_or_none') or ''}\n")
          PY

      - name: Publish bounded dispatch summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "agent-os-draft-validation" / "receipt.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Agent OS Draft final-candidate validation dispatch (#2410)\n\n")
              summary.write("A dispatch is not validation; this job grants no Ready, merge, or closure authority.\n\n")
              if not path.exists():
                  summary.write("Receipt unavailable; fail closed.\n")
              else:
                  receipt = json.loads(path.read_text(encoding="utf-8"))
                  summary.write(f"Decision: `{receipt.get('decision')}`\n\n")
                  summary.write(f"Reasons: `{','.join(receipt.get('reason_codes', []))}`\n\n")
                  summary.write(f"Run ID: `{receipt.get('run_id_or_none')}`\n\n")
                  summary.write(f"Run URL: {receipt.get('run_url_or_none')}\n")
          PY

      - name: Publish bounded dispatch evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-draft-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-os-draft-validation/*.json
          if-no-files-found: warn
          retention-days: 7

  draft_validation_receipt:
    name: Publish Draft validation dispatch receipt
    # #2410: receipt publication is a separate job holding issues: write and
    # no Actions authority. Posting is idempotent: an existing receipt for
    # the same trigger ID is never duplicated.
    needs: draft_validation_dispatch
    if: ${{ always() && github.event.issue.pull_request == null && github.ref == 'refs/heads/main' && (github.event.comment.user.id == 32861845 || github.event.comment.user.id == 199175422) && startsWith(github.event.comment.body, '/agent-os validate-draft ') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out canonical workflow source
        uses: actions/checkout@v7
        with:
          # No later step runs git against the remote; do not leave the job
          # token in .git/config where an installed dependency could read it.
          persist-credentials: false

      - name: Install bounded receipt runtime dependencies
        run: python -m pip install PyGithub==2.10.0 PyYAML==6.0.3

      - name: Parse low-trust issue comment envelope
        run: |
          mkdir -p "$RUNNER_TEMP/agent-os-draft-validation"
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.github_issue_comment_ingress \
              --event "$GITHUB_EVENT_PATH" \
              --repository "$GITHUB_REPOSITORY" \
              --allowed-actor Blummer92 \
              --draft-validation-service-actor 'chatgpt-codex-connector[bot]' \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$RUNNER_TEMP/agent-os-draft-validation/transport.json"

      - name: Assemble receipt from dispatch job outputs
        env:
          DISPATCH_DECISION: ${{ needs.draft_validation_dispatch.outputs.decision }}
          DISPATCH_RUN_ID: ${{ needs.draft_validation_dispatch.outputs.run_id }}
          DISPATCH_TRIGGER_ID: ${{ needs.draft_validation_dispatch.outputs.trigger_id }}
          DISPATCH_REASON_CODES: ${{ needs.draft_validation_dispatch.outputs.reason_codes }}
          DISPATCH_OBSERVED_HEAD_SHA: ${{ needs.draft_validation_dispatch.outputs.observed_head_sha }}
          DISPATCH_RUN_STATUS: ${{ needs.draft_validation_dispatch.outputs.run_status }}
          DISPATCH_RUN_CONCLUSION: ${{ needs.draft_validation_dispatch.outputs.run_conclusion }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.draft_validation_dispatch \
              --mode assemble \
              --transport "$RUNNER_TEMP/agent-os-draft-validation/transport.json" \
              --repository "$GITHUB_REPOSITORY" \
              --output "$RUNNER_TEMP/agent-os-draft-validation/receipt.json"

      - name: Post idempotent receipt comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PYTHONPATH=08_Tooling/workflow-scheduler/src \
            python -m workflow_scheduler.governance.draft_validation_dispatch \
              --mode receipt \
              --receipt "$RUNNER_TEMP/agent-os-draft-validation/receipt.json" \
              --repository "$GITHUB_REPOSITORY" \
              --issue-number "$ISSUE_NUMBER" \
              --output "$RUNNER_TEMP/agent-os-draft-validation/receipt-publication.json"

  ready_recovery_dispatch:

name: Agent OS CKR6 Comment Revalidation

# Trusted default-branch-only workflow. Reruns EXISTING PR gate checks; never
# grants CKR6 admission or publishes a new check/status. Unrelated learning
# operations and unbound issue-level requests return non-admitting not-applicable.
# An actual head-bound PR with no verified run still fails closed. Review
# actions:write scope before merge. Issue comments never execute PR code.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  revalidate:
    if: >-
      github.repository == 'Blummer92/agent-os' &&
      (
        (github.event.comment.user.id == 32861845 &&
         startsWith(github.event.comment.body, '/agent-os ckr6 ')) ||
        (github.event.comment.user.id == 41898282 &&
         startsWith(github.event.comment.body, '<!-- agent-os-ckr6-result:v1 -->'))
      )
    runs-on: ubuntu-latest
    concurrency:
      group: ckr6-comment-revalidate-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Check out default-branch trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install existing Agent OS runtime in isolated Python environment
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          python3 -m venv "$RUNNER_TEMP/ckr6-venv"
          "$RUNNER_TEMP/ckr6-venv/bin/python" -m pip install \
            -e 08_Tooling/reusable-capability-registry \
            -e 08_Tooling/agent-memory-context-manager \
            -e 08_Tooling/workflow-scheduler \
            -e src \
            -e . \
            -e 08_Tooling/agent-os-execution-service

      - name: Evaluate relevant exact-head CKR6 gate revalidation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/ckr6-venv/bin/python" -m agent_os_execution_service.ckr6_gate_revalidate

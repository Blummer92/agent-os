name: Agent OS CKR6 Comment Revalidation

# Retired legacy issue-comment revalidation. The job is permanently inert.
# Only the producer's separately privileged postback-complete job may rerun
# an existing exact-head gate after verifying a trusted result receipt.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  revalidate:
    # Retired: bot comments are not a reliable GitHub Actions trigger.
    # This legacy job is deliberately inert; producer postback owns reruns.
    if: ${{ false }}
    runs-on: ubuntu-latest
    concurrency:
      group: ckr6-comment-revalidate-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Check out default-branch trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install existing Agent OS runtime in isolated Python environment
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          python3 -m venv "$RUNNER_TEMP/ckr6-venv"
          "$RUNNER_TEMP/ckr6-venv/bin/python" -m pip install \
            -e 08_Tooling/reusable-capability-registry \
            -e 08_Tooling/agent-memory-context-manager \
            -e 08_Tooling/workflow-scheduler \
            -e src \
            -e . \
            -e 08_Tooling/agent-os-execution-service

      - name: Evaluate relevant exact-head CKR6 gate revalidation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/ckr6-venv/bin/python" -m agent_os_execution_service.ckr6_gate_revalidate

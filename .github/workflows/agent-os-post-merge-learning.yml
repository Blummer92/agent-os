name: Agent OS Post-Merge Learning Review

on:
  pull_request:
    paths:
      - "scripts/agent_os_post_merge_learning/**"
      - "tests/agent_os_post_merge_learning/**"
      - ".github/workflows/agent-os-post-merge-learning.yml"
  workflow_run:
    workflows: ["Agent OS Validation Gate"]
    types: [completed]
  # Manual replay is bound to both the PR number and exact merge SHA.
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_merge_sha:
        required: true
        type: string
      validation_run_id:
        required: false
        type: string

permissions:
  contents: read

jobs:
  premerge_tests:
    name: Post-merge learning positive and negative tests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install existing workflow-test YAML parser
        run: python -m pip install "PyYAML==6.0.3"
      - name: Run exact PR revision regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/08_Tooling/agent-memory-context-manager/src
        run: python tests/agent_os_post_merge_learning/run_suite.py

  review:
    name: Post-merge learning evidence (read only)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Pin the analyzer to the event's trusted default-branch revision.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install existing workflow-test YAML parser
        run: python -m pip install "PyYAML==6.0.3"
      - name: Positive and hard-negative tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/08_Tooling/agent-memory-context-manager/src
        run: python tests/agent_os_post_merge_learning/run_suite.py
      # Manual review exits 2 by design: an incomplete report is never green.
      # The always-run upload step preserves the bounded JSON receipt.
      - name: Read-only exact-merge analysis
        env:
          PYTHONPATH: ${{ github.workspace }}/08_Tooling/agent-memory-context-manager/src
          # All evidence endpoints are public; do not inject a token.
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_MERGE_SHA: ${{ inputs.expected_merge_sha }}
          INPUT_VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/post-merge-learning"
          args=(--repository "$REPOSITORY" --output "$RUNNER_TEMP/post-merge-learning/report.json")
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            args+=(--merge-sha "$RUN_MERGE_SHA" --validation-run-id "$RUN_ID")
          else
            args+=(--pr-number "$INPUT_PR" --merge-sha "$INPUT_MERGE_SHA")
            if [[ -n "$INPUT_VALIDATION_RUN_ID" ]]; then
              args+=(--validation-run-id "$INPUT_VALIDATION_RUN_ID")
            fi
          fi
          python -m scripts.agent_os_post_merge_learning.report "${args[@]}"
      - name: Require evidence receipt
        if: always()
        run: test -s "$RUNNER_TEMP/post-merge-learning/report.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-merge-learning-${{ github.run_id }}
          path: ${{ runner.temp }}/post-merge-learning/report.json
          if-no-files-found: error

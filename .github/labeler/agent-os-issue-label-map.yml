version: 1
source_issue_form: .github/ISSUE_TEMPLATE/agent-os-task.yml
mode: declarative-only

rules:
  additive_only: true
  remove_labels: false
  replace_labels: false
  apply_labels: false
  requires_existing_labels: true

base_labels:
  - agent-os

fields:
  tier:
    description: Tier classification evidence. Tier is canonical body evidence and is not projected as a label.
    values:
      tier:0-small-maintenance:
        labels: []
      tier:1-standard-implementation:
        labels: []
      tier:2-governed-cross-system:
        labels: []

  phase:
    description: Legacy phase label from the former issue form. Compatibility input only.
    values:
      implementation-phase-1:
        labels: [implementation-phase-1]
      post-cleanup:
        labels: []
      governance-planning:
        labels: []
      not-applicable:
        labels: []

  epic:
    description: Legacy roadmap or topic label. Compatibility input only.
    values:
      epic:foundation:
        labels: [epic:foundation]
      epic:connectors:
        labels: [epic:connectors]
      epic:classroom-artifact:
        labels: [epic:classroom-artifact]
      epic:hygiene:
        labels: [epic:hygiene]
      epic:workflow-scheduler:
        labels: [epic:workflow-scheduler]
      epic:navigation-registry:
        labels: [epic:navigation-registry]
      epic:governance:
        labels: [epic:governance]
      epic:curriculum-language-system:
        labels: [epic:curriculum-language-system]
      epic:google-cloud:
        labels: [epic:google-cloud]
      epic:issue-acceptance:
        labels: [epic:issue-acceptance]
      needs-decision:
        labels: [status:needs-decision]

  owner:
    description: Primary owner projection. New tiered issues use canonical registered agents; retired names remain legacy compatibility input and resolve to canonical labels.
    values:
      owner:chatgpt-orchestrator:
        labels: [owner:chatgpt-orchestrator]
      owner:github-service-agent:
        labels: [owner:github-service-agent]
      owner:modeling-dashboard-governance-agent:
        labels: [owner:modeling-dashboard-governance-agent]
      owner:qa-test-agent:
        labels: [owner:qa-test-agent]
      owner:agent-orchestrator:
        labels: [owner:agent-orchestrator]
      owner:unit-alignment-agent:
        labels: [owner:unit-alignment-agent]
      owner:teacher-modeling-coach:
        labels: [owner:teacher-modeling-coach]
      owner:instructional-materials-coach:
        labels: [owner:instructional-materials-coach]
      owner:integration-manager:
        labels: [owner:chatgpt-orchestrator]
      owner:google-workspace-automation-engineer:
        labels: [owner:github-service-agent]
      needs-decision:
        labels: [status:needs-decision]

  status:
    description: Canonical readiness projection. Only ready, blocked, and needs-decision are managed readiness labels; proposed is not a canonical readiness state.
    values:
      status:ready:
        labels: [status:ready]
      status:blocked:
        labels: [status:blocked]
      status:needs-decision:
        labels: [status:needs-decision]

  type:
    description: Searchable work-type projection. Legacy issue bodies and the current work-type field share this canonical map.
    multiple: true
    values:
      type:bug:
        labels: [type:bug]
      type:docs:
        labels: [type:docs]
      type:tooling:
        labels: [type:tooling]
      type:governance:
        labels: [type:governance]
      type:validation:
        labels: [type:validation]
      type:classroom-artifact:
        labels: [type:classroom-artifact]
      type:planning:
        labels: [type:planning]

  source-of-truth:
    description: Source-of-truth routing evidence. It remains body evidence except that ambiguity projects needs-decision.
    values:
      GitHub:
        labels: []
      Notion handoff:
        labels: []
      Google Drive handoff:
        labels: []
      ChatGPT planning only:
        labels: []
      needs-decision:
        labels: [status:needs-decision]

  external-write:
    description: External-write boundary evidence. no-external-write is not a label or authorization; requested/ambiguous external writes project needs-decision.
    values:
      no-external-write:
        labels: []
      external-write-requested:
        labels: [status:needs-decision]
      needs-decision:
        labels: [status:needs-decision]

validation_notes:
  - New tiered issue intake exposes only canonical registered owner identities.
  - Retired owner values remain compatibility input for historical issues and resolve through the legacy alias registry to canonical owner labels.
  - Canonical readiness labels are status:ready, status:blocked, and status:needs-decision; status:proposed is not a readiness projection.
  - Work type is optional searchable classification and never creates readiness or execution authority.
  - Tier, source-of-truth, and no-external-write remain body evidence rather than additional label families.
  - This file is configuration only and must not apply labels by itself.
  - Tests must use fixtures and must not require live GitHub credentials or network access.

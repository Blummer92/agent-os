    semantic_owner: Unit Alignment Agent
    canonical_source: lp-pacing-handoff-contract
    purpose: display the routing recommendation without altering Single Next Owner
    permitted_writer: unit-alignment-agent
    authority_class: advisory
    privacy_class: none
    retention_class: planning-cycle
    missing_behaviour: display NOT_EVALUATED
    prohibited_implication: gate-advancement
    normative_id: display-owner-named-on-gate
  - target: unit-alignment-readiness-dashboard
    name: Pathway Brief Available — Advisory
    semantic_owner: Unit Alignment Agent
    canonical_source: lesson-pacing-and-pathways
    purpose: indicate that route briefs exist for review
    permitted_writer: unit-alignment-agent
    authority_class: advisory
    privacy_class: none
    retention_class: planning-cycle
    missing_behaviour: display NOT_EVALUATED
    prohibited_implication: placement
    normative_id: projection-pathway-briefs-only
  - target: lesson-pacing-and-pathways
    name: Difficulty Diagnosis — Six Dimensions
    semantic_owner: Unit Alignment Agent
    canonical_source: lp-pacing-handoff-contract
    purpose: hold the six separated dimensions as six distinct properties
    permitted_writer: unit-alignment-agent
    authority_class: advisory
    privacy_class: none

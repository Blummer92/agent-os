    permitted_writer: teacher
    authority_class: evidence
    privacy_class: lp10-restricted
    retention_class: lp10-governed
    missing_behaviour: display not-reviewed
    prohibited_implication: readiness
    normative_id: eia-visible-review-and-staleness
  - target: lesson-pacing-and-pathways
    name: What Supported / What Remains Unmeasured
    semantic_owner: Unit Alignment Agent
    canonical_source: lp-pacing-handoff-contract
    purpose: expose evidence reach instead of one overall score
    permitted_writer: unit-alignment-agent
    authority_class: evidence
    privacy_class: aggregate-deidentified
    retention_class: review-window
    missing_behaviour: display blank
    prohibited_implication: mastery
    normative_id: eia-what-supported-and-unmeasured
  - target: lesson-run-log
    name: Aggregate Run Summary
    semantic_owner: Unit Alignment Agent
    canonical_source: lp-pacing-handoff-contract
    purpose: hold one aggregate, de-identified record per planned run
    permitted_writer: teacher
    authority_class: evidence
    privacy_class: aggregate-deidentified
    retention_class: lp10-governed
    missing_behaviour: display blank
    prohibited_implication: learner-classification
    normative_id: architecture-lesson-run-log

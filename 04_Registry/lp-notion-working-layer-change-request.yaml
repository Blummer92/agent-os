prohibited_data:
  - value: raw-scans-or-page-images
  - value: cropped-answer-regions
  - value: handwriting-samples
  - value: full-recognized-responses-or-transcripts
  - value: answer-level-or-learner-level-histories
  - value: student-names-or-identifiers
  - value: diagnoses-or-protected-characteristics
  - value: row-per-student-records
  - value: permanent-ability-labels
  - value: model-internals-or-embeddings
  - value: opaque-similarity-percentage
  - value: continuous-telemetry
pilot_records:
  - id: blind-photography-launch
    minimum_fields: 9
    provisional_timing_range_required: true
    route_briefs_required: false
    synthetic_evidence_summary: optional
  - id: composition-three-shot-planning
    minimum_fields: 9
    provisional_timing_range_required: true
    route_briefs_required: true
    synthetic_evidence_summary: optional
  - id: production-cycles-watch-check-fix
    minimum_fields: 11

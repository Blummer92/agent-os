    route_briefs_required: true
    synthetic_evidence_summary: optional
operational_plan:
  preflight:
    - value: confirm exact target identifiers against the live workspace
    - value: confirm no property in the allowlist already exists with conflicting semantics
    - value: confirm LP10 retention, access, deletion, and incident rules are approved
    - value: confirm accessibility review is complete
  verification:
    - value: confirm every created property carries its full authority map
    - value: confirm no formula, rollup, or automation reads a pacing value into a gate
    - value: confirm NOT_EVALUATED renders distinctly from blank, blocked, and cleared
    - value: confirm no prohibited data can be reconstructed through relations, exports, or views
  rollback:
    - value: remove created properties, relations, views, forms, and templates in reverse order
    - value: delete created records and confirm deletion
    - value: leave every pre-existing property and historical literal unchanged
  incident:
    - value: suspend the projection and route to the Integration Manager
    - value: preserve evidence and record the incident before any corrective write
non_authority_guarantees:
  - value: no property advances Unit Generation Approval
  - value: no property advances a modeling handoff gate
  - value: no property advances Production Authorized
  - value: no property assigns a grade, a learner route, or a placement
  - value: no property changes a success criterion
  - value: no view or rollup combines owner states into one status

observed_properties:
  - target: unit-alignment-readiness-dashboard
    property: Cognitive Load Risk
    finding: single-select risk label that cannot represent the six separated dimensions
    reuse_decision: do-not-reuse
    normative_id: projection-separate-diagnosis-fields
  - target: unit-alignment-readiness-dashboard
    property: Alignment Confidence
    finding: owned by unit alignment and already scoped to alignment, not pacing
    reuse_decision: do-not-reuse
    normative_id: authority-required-property-map
  - target: unit-alignment-readiness-dashboard
    property: Human Review Needed
    finding: semantics and writer match the manual-review requirement exactly
    reuse_decision: reuse
    normative_id: authority-required-property-map
  - target: unit-alignment-readiness-dashboard
    property: Last Reviewed
    finding: existing review date; pacing needs its own review date to avoid overwriting alignment review
    reuse_decision: do-not-reuse
    normative_id: authority-required-property-map
  - target: unit-alignment-readiness-dashboard
    property: Unit Generation Approval
    finding: canonical unit-approval gate owned outside the pacing lane
    reuse_decision: mirror-display-only
    normative_id: authority-display-only-gates
  - target: unit-alignment-readiness-dashboard
    property: Modeling Feasibility Gate
    finding: existing owner gate whose `Not reviewed` option must map to a visible NOT_EVALUATED display, never to cleared
    reuse_decision: mirror-display-only
    normative_id: authority-not-evaluated-visible
  - target: unit-alignment-readiness-dashboard
    property: Planning Gate Status
    finding: carries the approval-sounding literal `Ready for teacher modeling handoff`
    reuse_decision: historical-display-only
    normative_id: migration-legacy-status-literals
  - target: unit-alignment-readiness-dashboard
    property: Single Next Owner
    finding: existing next-owner routing property; the pacing recommendation must not overwrite it
    reuse_decision: do-not-reuse
    normative_id: authority-no-gate-advancement
  - target: unit-alignment-readiness-dashboard
    property: Student Evidence Coach Dashboard
    finding: relation to the Notion-side governance ownership label recorded in the governance baseline; it has no GitHub overlay and no LP property is written through it
    reuse_decision: do-not-reuse
    normative_id: migration-notion-side-ownership-label
  - target: unit-alignment-tracker
    property: Differentiation updated
    finding: status property with Not started / In progress / Done, recording past editing activity rather than pathway evidence
    reuse_decision: historical-display-only
    normative_id: migration-historical-differentiation
  - target: unit-alignment-tracker
    property: Status
    finding: unscoped status literal including `Ready to teach`
    reuse_decision: historical-display-only
    normative_id: migration-legacy-status-literals
proposed_properties:

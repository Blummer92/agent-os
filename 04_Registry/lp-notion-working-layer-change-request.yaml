    purpose: display the advisory pacing outcome for the unit
    permitted_writer: unit-alignment-agent
    authority_class: advisory
    privacy_class: none
    retention_class: planning-cycle
    missing_behaviour: display NOT_EVALUATED
    prohibited_implication: gate-advancement
    normative_id: display-advisory-labelled
  - target: unit-alignment-readiness-dashboard
    name: Pacing Confidence
    semantic_owner: Unit Alignment Agent
    canonical_source: lp-pacing-handoff-contract

    owner: Unit Alignment Agent
    detail: three requirements in the 649 body contradict the ratified contracts
  - id: cw5a-accepts-lp-reason-namespace
    normative_id: gate-cw5a-reason-namespace
    satisfied: false
    owner: Integration Manager
    detail: CW5A validate_reason_code rejects every lp-* code, so CW5A reason reuse and LP15 emission cannot both be satisfied today
  - id: owner-authorization
    normative_id: gate-owner-authorization
    satisfied: false
    owner: Google Workspace Automation Engineer
    detail: explicit authorization of this handoff is required before a branch exists

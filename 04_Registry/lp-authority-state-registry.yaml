      normative_id: route-continue
    - value: revise
      normative_id: route-revise
    - value: hold
      normative_id: route-hold
    - value: manual-review
      normative_id: route-manual-review
  deployment_lifecycle_states:
    - value: draft
      normative_id: lifecycle-draft
    - value: shadow
      normative_id: lifecycle-shadow
    - value: active
      normative_id: lifecycle-active
    - value: retired
      normative_id: lifecycle-retired
gate_states:

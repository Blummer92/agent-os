registry_name: lp-authority-state-registry
contract_version: "1.0"
record_revision: 1
normative_standard: 01_Shared_Standards/instructional-design/lp-authority-state-registry.md
bounds:
  reason_codes:
    maximum: 16
    normative_id: bound-reason-codes
  source_references:
    maximum: 20
    normative_id: bound-source-references
  unresolved_uncertainties:
    maximum: 12
    normative_id: bound-unresolved-uncertainties
  explanations:

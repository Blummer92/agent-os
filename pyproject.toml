[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os-navigation-registry"
version = "0.1.0"
description = "Offline Navigation Registry connector prototype for Agent OS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["navigation_registry", "navigation_registry.*"]

# Repository-wide linting starts with correctness-oriented rules only.
# Templates and archived planning are not active Python implementation surfaces.
[tool.ruff]
target-version = "py311"
extend-exclude = ["03_Templates", "06_Archive"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

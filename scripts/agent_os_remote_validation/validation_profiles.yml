{
  "selector_version": "1.0.0",
  "repository": "Blummer92/agent-os",
  "documentation_suffixes": [".md", ".txt", ".rst"],
  "documentation_prefixes": ["00_Governance/", "01_Shared_Standards/", "02_Agent_Overlays/", "03_Templates/", "04_Registry/", "05_Roadmap/", "06_Archive/"],
  "aggregate_paths": ["cloudbuild.yaml", "pyproject.toml", "requirements-dev.txt", "pytest.ini"],
  "aggregate_prefixes": [".github/workflows/", "tests/test_agent_os_validation_workflow.py"],
  "focused_rules": [
    {
      "name": "issue-acceptance",
      "prefixes": ["scripts/agent_os_issue_acceptance/", "tests/agent_os_issue_acceptance/"],
      "commands": ["python -m pytest tests/agent_os_issue_acceptance"]
    },
    {
      "name": "workflow-scheduler",
      "prefixes": ["08_Tooling/workflow-scheduler/"],
      "commands": ["python -m pytest 08_Tooling/workflow-scheduler/tests"]
    },
    {
      "name": "workflow-scheduler-concrete-runtime-adapters",
      "exact_paths": ["08_Tooling/workflow-scheduler/tests/test_concrete_runtime_adapters.py"],
      "commands": ["python -m pytest 08_Tooling/workflow-scheduler/tests/test_concrete_runtime_adapters.py"]
    },
    {
      "name": "navigation-registry",
      "prefixes": ["08_Tooling/notion-navigation-client/"],
      "commands": ["python -m pytest 08_Tooling/notion-navigation-client/tests"]
    },
    {
      "name": "picture-perfect-coach",
      "prefixes": ["08_Tooling/instructional-materials-coach/picture-perfect-coach/"],
      "commands": ["cd 08_Tooling/instructional-materials-coach/picture-perfect-coach && npm run check"]
    },
    {
      "name": "instructional-materials-coach",
      "prefixes": [
        "08_Tooling/instructional-materials-coach/src/",
        "08_Tooling/instructional-materials-coach/tests/",
        "08_Tooling/instructional-materials-coach/capture/",
        "08_Tooling/instructional-materials-coach/docs/",
        "08_Tooling/instructional-materials-coach/reports/",
        "08_Tooling/instructional-materials-coach/samples/"
      ],
      "exact_paths": [
        "08_Tooling/instructional-materials-coach/.env.example",
        "08_Tooling/instructional-materials-coach/BUGS.md",
        "08_Tooling/instructional-materials-coach/CHANGELOG.md",
        "08_Tooling/instructional-materials-coach/README.md",
        "08_Tooling/instructional-materials-coach/pyproject.toml"
      ],
      "commands": ["python -m pytest 08_Tooling/instructional-materials-coach/tests"]
    },
    {
      "name": "curriculum-pipeline-boundaries",
      "exact_paths": ["tests/test_curriculum_pipeline_boundaries.py"],
      "commands": ["python -m pytest tests/test_curriculum_pipeline_boundaries.py"]
    },
    {
      "name": "curriculum-language-system",
      "exact_paths": ["tests/test_curriculum_language_system.py"],
      "commands": ["python -m pytest tests/test_curriculum_language_system.py"]
    },
    {
      "name": "teacher-modeling-workflows",
      "exact_paths": ["tests/test_teacher_modeling_workflows.py"],
      "commands": ["python -m pytest tests/test_teacher_modeling_workflows.py"]
    }
  ],
  "command_coverage": [
    {
      "broader": "python -m pytest 08_Tooling/workflow-scheduler/tests",
      "subsumes": [
        "python -m pytest 08_Tooling/workflow-scheduler/tests/test_concrete_runtime_adapters.py"
      ]
    }
  ],
  "aggregate_command": "python -m pytest"
}
